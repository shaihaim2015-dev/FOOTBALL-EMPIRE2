<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOOTBALL EMPIRE 1.7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#07130f;
  --bg-1:#0d1f19;
  --bg-2:#122b23;
  --panel:#0f2019;
  --panel-2:#15291f;
  --line:#1f3d31;
  --pitch:#0e2a1c;
  --pitch-2:#123321;
  --green:#22c17a;
  --green-2:#0f8f5a;
  --blue:#2ea9ff;
  --blue-2:#1c6fbf;
  --gold:#e8b94b;
  --red:#ff5f5f;
  --yellow:#ffcf4d;
  --text:#eaf5ef;
  --text-dim:#8fa89c;
  --text-dim-2:#5f776b;
  --radius:10px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(46,169,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 100% 0%, rgba(34,193,122,.14), transparent 55%),
    linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-0));
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  overflow-x:hidden;
  min-height:100%;
}
h1,h2,h3,.display{font-family:'Oswald',sans-serif; letter-spacing:.02em; text-transform:uppercase; margin:0;}
button{font-family:'Rajdhani',sans-serif; cursor:pointer; border:none; outline:none;}
.hidden{display:none !important;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Buttons ---------- */
.btn{
  padding:12px 22px; border-radius:8px; font-weight:600; font-size:15px;
  background:var(--panel-2); color:var(--text); border:1px solid var(--line);
  transition:.15s ease; letter-spacing:.03em;
}
.btn:hover{border-color:var(--green); box-shadow:0 0 0 1px var(--green) inset;}
.btn:active{transform:scale(.98);}
.btn-primary{
  background:linear-gradient(135deg,var(--green),var(--green-2));
  color:#04140c; border:none; box-shadow:0 8px 20px rgba(34,193,122,.25);
}
.btn-primary:hover{filter:brightness(1.08); box-shadow:0 8px 26px rgba(34,193,122,.4);}
.btn-blue{background:linear-gradient(135deg,var(--blue),var(--blue-2)); color:#04140c; border:none;}
.btn-danger{background:linear-gradient(135deg,#ff7a7a,#c23a3a); color:#1a0505; border:none;}
.btn-ghost{background:transparent; border:1px solid var(--line); color:var(--text-dim);}
.btn-ghost:hover{color:var(--text); border-color:var(--text-dim);}
.btn-sm{padding:7px 12px; font-size:13px; border-radius:6px;}
.btn:disabled{opacity:.35; cursor:not-allowed; box-shadow:none;}

/* ---------- Layout scaffolding ---------- */
.screen{min-height:100vh; padding:28px; animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.center-col{max-width:520px; margin:0 auto;}
.wrap{max-width:1400px; margin:0 auto;}

/* ---------- Main Menu ---------- */
#screen-menu{display:flex; align-items:center; justify-content:center; min-height:100vh;}
.menu-card{
  text-align:center; padding:60px 50px; background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  width:min(520px,92vw);
}
.menu-card::before{
  content:""; position:absolute; inset:-2px; z-index:0; opacity:.5;
  background:conic-gradient(from 180deg at 50% -20%, transparent, rgba(34,193,122,.25), transparent 40%);
}
.menu-card>*{position:relative; z-index:1;}
.logo-ball{font-size:52px; display:block; margin-bottom:6px; filter:drop-shadow(0 6px 14px rgba(34,193,122,.35));}
.logo-title{font-size:40px; font-weight:700; background:linear-gradient(135deg,#fff,var(--green) 60%,var(--blue)); -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1;}
.logo-sub{color:var(--text-dim); font-size:13px; letter-spacing:.35em; margin-top:8px; text-transform:uppercase;}
.menu-actions{display:flex; flex-direction:column; gap:12px; margin-top:36px;}

/* Feedback & Rating */
.star-row{display:flex; gap:6px; justify-content:center; margin:14px 0;}
.star-btn{font-size:38px; line-height:1; background:none; border:none; cursor:pointer; color:var(--line); transition:transform .15s ease, color .15s ease; padding:0;}
.star-btn:hover{transform:scale(1.15);}
.star-btn.filled{color:var(--gold); text-shadow:0 0 14px rgba(232,185,75,.5);}
.star-btn.pulse{animation:starPulse .35s ease;}
@keyframes starPulse{0%{transform:scale(1);} 50%{transform:scale(1.35);} 100%{transform:scale(1);}}
.fb-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:18px;}
.fb-textarea{width:100%; min-height:90px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; color:var(--text); padding:12px; font-family:'Rajdhani'; font-size:14px; resize:vertical;}
.fb-textarea:focus{outline:none; border-color:var(--green);}
.review-card{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px;}
.suggestion-row{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px;}
.vote-btn{display:flex; flex-direction:column; align-items:center; gap:2px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; color:var(--text-dim); font-weight:700; transition:.15s;}
.vote-btn.voted{color:var(--green); border-color:var(--green); background:rgba(34,193,122,.1);}
.vote-btn:disabled{cursor:default;}
.rank-badge{font-family:'Oswald'; font-weight:700; font-size:15px; width:26px; text-align:center;}
.version-tag{position:fixed; bottom:14px; left:16px; color:var(--text-dim-2); font-size:12px; letter-spacing:.1em;}

/* ---------- Team select ---------- */
.page-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
.team-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;}
.team-card{
  background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px;
  cursor:pointer; transition:.15s; position:relative; overflow:hidden;
}
.team-card:hover{border-color:var(--green); transform:translateY(-3px); box-shadow:var(--shadow);}
.team-card.selected{border-color:var(--green); box-shadow:0 0 0 2px var(--green) inset;}
.crest{
  width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:'Oswald',sans-serif; font-weight:700; font-size:20px; color:#04140c; margin-bottom:12px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.18), 0 6px 14px rgba(0,0,0,.35);
}
.team-name{font-size:18px; font-weight:600;}
.team-meta{color:var(--text-dim); font-size:13px; margin-top:4px;}
.team-stats-row{display:flex; gap:14px; margin-top:12px; font-size:12px; color:var(--text-dim);}
.team-stats-row b{color:var(--text); font-size:14px; display:block;}
.player-mini-list{margin-top:12px; display:flex; flex-wrap:wrap; gap:5px;}
.tag{background:var(--panel-2); border:1px solid var(--line); border-radius:5px; padding:2px 7px; font-size:11px; color:var(--text-dim);}

/* ---------- Dashboard ---------- */
#screen-dashboard{padding:0;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; padding:14px 26px;
  background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
}
.topbar-left{display:flex; align-items:center; gap:14px;}
.topbar-crest{width:38px;height:38px;border-radius:50%;}
.club-title{font-weight:700; font-size:18px; font-family:'Oswald',sans-serif;}
.club-sub{font-size:12px; color:var(--text-dim);}
.topbar-stats{display:flex; gap:22px;}
.stat-chip{text-align:center;}
.stat-chip .v{font-family:'Oswald',sans-serif; font-size:16px; font-weight:600;}
.stat-chip .l{font-size:10px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase;}
.tabbar{display:flex; gap:4px; padding:10px 26px; background:var(--bg-1); border-bottom:1px solid var(--line); overflow-x:auto;}
.tab-btn{padding:9px 16px; border-radius:7px; background:transparent; color:var(--text-dim); font-weight:600; font-size:14px; white-space:nowrap;}
.tab-btn.active{background:var(--panel-2); color:var(--green); box-shadow:0 0 0 1px var(--line) inset;}
.tab-content{padding:22px 26px 60px;}

/* Squad */
.squad-table{width:100%; border-collapse:collapse; background:var(--panel); border-radius:12px; overflow:hidden; border:1px solid var(--line);}
.squad-table th{text-align:right; font-size:11px; letter-spacing:.08em; color:var(--text-dim); text-transform:uppercase; padding:10px 12px; background:var(--panel-2); border-bottom:1px solid var(--line);}
.squad-table td{padding:10px 12px; border-bottom:1px solid var(--line); font-size:14px;}
.squad-table tr:last-child td{border-bottom:none;}
.squad-table tr:hover{background:rgba(34,193,122,.05);}
.pos-badge{display:inline-block; width:34px; text-align:center; padding:3px 0; border-radius:5px; font-size:11px; font-weight:700; background:var(--panel-2); border:1px solid var(--line);}
.pos-GK{color:var(--gold);} .pos-DEF{color:var(--blue);} .pos-MID{color:var(--green);} .pos-ATT{color:#ff9a5f;}
.ovr-pill{display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; font-weight:700; font-size:13px; font-family:'Oswald',sans-serif; background:var(--panel-2); border:1px solid var(--line);}
.bar-mini{width:70px; height:6px; background:var(--panel-2); border-radius:4px; overflow:hidden; display:inline-block; vertical-align:middle; margin-left:6px;}
.bar-mini i{display:block; height:100%; background:linear-gradient(90deg,var(--green),var(--blue));}
.bench-tag{font-size:10px; color:var(--text-dim-2); border:1px solid var(--line); border-radius:5px; padding:1px 6px;}

/* League table */
.league-table{width:100%; border-collapse:collapse; background:var(--panel); border-radius:12px; overflow:hidden; border:1px solid var(--line);}
.league-table th{padding:10px; font-size:11px; color:var(--text-dim); text-transform:uppercase; background:var(--panel-2); border-bottom:1px solid var(--line);}
.league-table td{padding:9px 10px; text-align:center; border-bottom:1px solid var(--line); font-size:14px;}
.league-table td:first-child, .league-table td:nth-child(2){text-align:right;}
.league-table tr.me{background:rgba(34,193,122,.12);}
.league-table tr.me td{font-weight:700;}

/* Match center card */
.match-cta{
  background:linear-gradient(135deg,var(--panel-2),var(--panel)); border:1px solid var(--line); border-radius:16px;
  padding:26px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
}
.vs-row{display:flex; align-items:center; gap:16px; font-size:22px; font-family:'Oswald',sans-serif; font-weight:600;}
.vs-sep{color:var(--text-dim); font-size:14px;}

/* Transfer market */
.filters-row{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.select, .input{background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:9px 12px; border-radius:7px; font-family:'Rajdhani'; font-size:14px;}
.player-row{display:flex; align-items:center; justify-content:space-between; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:8px;}
.player-row .pl-left{display:flex; align-items:center; gap:14px;}
.player-row .pl-name{font-weight:600; font-size:15px;}
.player-row .pl-meta{font-size:12px; color:var(--text-dim);}
.value-tag{font-family:'Oswald',sans-serif; font-weight:600; color:var(--gold);}

/* Modal */
.modal-bg{position:fixed; inset:0; background:rgba(4,10,8,.72); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:100; animation:fadeIn .2s ease;}
.modal{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:26px; width:min(420px,90vw); box-shadow:var(--shadow);}
.modal h3{margin-bottom:14px;}
.modal .row{display:flex; justify-content:space-between; margin:8px 0; font-size:14px;}
.modal .row b{color:var(--gold);}
.modal-actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}

/* ---------- MATCH SCREEN ---------- */
#screen-match{padding:0; background:var(--bg-0);}
.match-header{
  display:flex; align-items:center; justify-content:center; gap:26px; padding:14px 20px;
  background:linear-gradient(180deg,var(--panel),var(--panel-2)); border-bottom:1px solid var(--line);
}
.mh-team{display:flex; align-items:center; gap:10px; font-family:'Oswald',sans-serif; font-size:18px; font-weight:600;}
.mh-crest{width:34px;height:34px;border-radius:50%;}
.mh-score{font-family:'Oswald',sans-serif; font-size:34px; font-weight:700; letter-spacing:.05em; background:var(--bg-0); padding:4px 18px; border-radius:8px; border:1px solid var(--line);}
.mh-clock{font-family:'Oswald',sans-serif; font-size:20px; color:var(--green); background:var(--bg-0); padding:6px 14px; border-radius:8px; border:1px solid var(--line); min-width:78px; text-align:center;}
.mh-status{font-size:12px; color:var(--text-dim); text-align:center; letter-spacing:.1em; text-transform:uppercase;}

.match-body{display:grid; grid-template-columns:1fr 300px; gap:0; align-items:start;}
.pitch-col{padding:18px; display:flex; flex-direction:column; align-items:center; gap:12px;}
.pitch-wrap{position:relative; width:100%; max-width:900px;}
#pitchCanvas{width:100%; height:auto; display:block; border-radius:12px; border:1px solid var(--line); box-shadow:var(--shadow);}
.cam-controls{display:flex; gap:8px;}
.event-toast{
  position:absolute; top:14px; left:50%; transform:translateX(-50%); background:rgba(7,19,15,.92);
  border:1px solid var(--green); color:var(--text); padding:10px 22px; border-radius:10px; font-family:'Oswald',sans-serif;
  font-size:18px; font-weight:600; letter-spacing:.03em; opacity:0; transition:opacity .25s ease, transform .25s ease; pointer-events:none; text-align:center;
}
.event-toast.show{opacity:1; transform:translateX(-50%) translateY(4px);}

.side-col{background:var(--panel); border-right:none; border-left:1px solid var(--line); min-height:100%; display:flex; flex-direction:column;}
.side-tabs{display:flex; border-bottom:1px solid var(--line);}
.side-tab{flex:1; padding:11px 0; text-align:center; font-size:12px; letter-spacing:.06em; color:var(--text-dim); background:var(--panel-2); text-transform:uppercase; font-weight:700;}
.side-tab.active{color:var(--green); background:var(--panel);}
.side-panel{padding:16px; flex:1; overflow-y:auto; max-height:calc(100vh - 250px);}
.events-log{display:flex; flex-direction:column-reverse; gap:8px;}
.ev-line{font-size:13px; display:flex; gap:8px; border-bottom:1px dashed var(--line); padding-bottom:7px;}
.ev-time{color:var(--green); font-family:'Oswald',sans-serif; font-weight:600; min-width:38px;}
.ev-icon{width:18px; text-align:center;}
.tactic-group{margin-bottom:20px;}
.tactic-group h4{font-size:11px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase; margin-bottom:8px;}
.tactic-opts{display:flex; flex-direction:column; gap:6px;}
.tactic-opt{padding:9px 12px; border-radius:7px; background:var(--panel-2); border:1px solid var(--line); font-size:13px; color:var(--text-dim); text-align:right;}
.tactic-opt.active{border-color:var(--green); color:var(--green); background:rgba(34,193,122,.08);}
.sub-row{display:flex; justify-content:space-between; align-items:center; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:9px 10px; margin-bottom:7px; font-size:13px;}
.stamina-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-left:6px;}

/* Penalty overlay */
.penalty-overlay{position:fixed; inset:0; background:rgba(4,10,8,.85); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:200; gap:18px;}
.penalty-title{font-family:'Oswald',sans-serif; font-size:36px; color:var(--red); letter-spacing:.1em; text-shadow:0 0 20px rgba(255,95,95,.5);}
.penalty-scene{width:min(500px,88vw); height:180px; background:var(--pitch); border-radius:12px; border:2px solid var(--line); position:relative; overflow:hidden;}

/* Match summary */
.summary-card{max-width:640px; margin:40px auto; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:30px; box-shadow:var(--shadow);}
.summary-score{text-align:center; font-family:'Oswald',sans-serif; font-size:30px; font-weight:700; margin-bottom:6px;}
.summary-sub{text-align:center; color:var(--text-dim); font-size:13px; text-transform:uppercase; letter-spacing:.1em; margin-bottom:22px;}
.goal-list{margin:16px 0; font-size:14px; color:var(--text-dim);}
.stat-bar-row{margin:10px 0;}
.stat-bar-row .lbl{display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;}
.stat-bar-track{height:7px; border-radius:5px; background:var(--panel-2); display:flex; overflow:hidden;}
.stat-bar-a{background:var(--green);} .stat-bar-b{background:var(--blue);}
.motm{text-align:center; margin-top:20px; padding:14px; border:1px dashed var(--gold); border-radius:10px; color:var(--gold); font-weight:700;}

@media (max-width:900px){
  .match-body{grid-template-columns:1fr;}
  .side-col{border-left:none; border-top:1px solid var(--line);}
  .topbar-stats{display:none;}
}
</style>
</head>
<body>

<!-- ============ MAIN MENU ============ -->
<div class="screen" id="screen-menu">
  <div class="menu-card">
    <span class="logo-ball">⚽</span>
    <div class="logo-title">FOOTBALL<br>EMPIRE</div>
    <div class="logo-sub">Manage · Build · Conquer</div>
    <div class="menu-actions">
      <button class="btn btn-primary" onclick="startNewCareer()">קריירה חדשה</button>
      <button class="btn btn-blue" id="btnContinue" onclick="continueCareer()">המשך קריירה</button>
      <button class="btn btn-ghost" onclick="openFeedbackScreen()">⭐ דירוג ומשוב</button>
      <button class="btn btn-ghost" onclick="openSettings()">הגדרות</button>
    </div>
  </div>
</div>
<div class="version-tag">FOOTBALL EMPIRE 1.7</div>

<!-- ============ FEEDBACK & RATING ============ -->
<div class="screen hidden" id="screen-feedback">
  <div class="wrap" style="max-width:720px;">
    <div class="page-title">
      <h2>⭐ FEEDBACK & RATING</h2>
      <button class="btn btn-ghost btn-sm" onclick="showScreen('menu')">חזרה לתפריט</button>
    </div>
    <div id="feedbackBody"></div>
  </div>
</div>

<!-- ============ TEAM SELECT ============ -->
<div class="screen hidden" id="screen-teamselect">
  <div class="wrap">
    <div class="page-title">
      <h2>בחר את הקבוצה שלך</h2>
      <button class="btn btn-ghost" onclick="showScreen('menu')">חזרה</button>
    </div>
    <div class="team-grid" id="teamGrid"></div>
    <div style="text-align:center; margin-top:26px;">
      <button class="btn btn-primary" id="btnConfirmTeam" onclick="confirmTeamSelection()" disabled>התחל קריירה</button>
    </div>
  </div>
</div>

<!-- ============ DASHBOARD ============ -->
<div class="screen hidden" id="screen-dashboard">
  <div class="topbar">
    <div class="topbar-left">
      <div class="crest topbar-crest" id="tbCrest"></div>
      <div>
        <div class="club-title" id="tbClubName">-</div>
        <div class="club-sub">עונה <span id="tbSeason">1</span> · סיבוב <span id="tbRound">1</span></div>
      </div>
    </div>
    <div class="topbar-stats">
      <div class="stat-chip"><div class="v" id="tbBudget">-</div><div class="l">תקציב</div></div>
      <div class="stat-chip"><div class="v" id="tbRep">-</div><div class="l">מוניטין</div></div>
      <div class="stat-chip"><div class="v" id="tbPos">-</div><div class="l">מיקום בטבלה</div></div>
      <div class="stat-chip"><div class="v" id="tbPoints">-</div><div class="l">נקודות</div></div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="showScreen('menu')">תפריט ראשי</button>
  </div>

  <div class="tabbar">
    <button class="tab-btn active" data-tab="home" onclick="switchTab('home')">מרכז המשחקים</button>
    <button class="tab-btn" data-tab="squad" onclick="switchTab('squad')">סגל</button>
    <button class="tab-btn" data-tab="lineup" onclick="switchTab('lineup')">מערך</button>
    <button class="tab-btn" data-tab="calendar" onclick="switchTab('calendar')">📅 לוח שנה</button>
    <button class="tab-btn" data-tab="league" onclick="switchTab('league')">🏆 מפעלים</button>
    <button class="tab-btn" data-tab="stats" onclick="switchTab('stats')">👑 מלכי הסטטיסטיקה</button>
    <button class="tab-btn" data-tab="market" onclick="switchTab('market')">שוק העברות</button>
  </div>

  <div class="tab-content" id="tab-home"></div>
  <div class="tab-content hidden" id="tab-squad"></div>

const BENCH_NAMES = ['A. Silva','R. Costa','M. Neto','J. Brito','T. Freitas','L. Moura','P. Alves','D. Ferreira','C. Santos','R. Lima','G. Pinto','N. Rocha','H. Duarte','B. Cunha','F. Nunes','S. Matos'];
function makeBench(seed){
  // A deeper reserve pool per club: 1 GK, 3 DEF, 2 MID, 2 ATT — gives every club enough
  // depth for substitutions, formation changes and a real transfer market.
  let out=[];
  let roles=['GK','DEF','DEF','DEF','MID','MID','ATT','ATT'];
  for(let i=0;i<roles.length;i++){
    let base = 62+Math.floor(Math.random()*14);
    let nm = BENCH_NAMES[(seed*11+i*5)%BENCH_NAMES.length]+' '+(i+1);
    out.push(P(nm, roles[i], base, base-4+rnd(-4,4), base-4+rnd(-4,4), base-4+rnd(-4,4), base-4+rnd(-4,4), base-4+rnd(-4,4), base-4+rnd(-4,4), rnd(2,4)));
  }
  return out;
}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

/* ------------------- SQUAD DEPTH GENERATOR (7 additional bench players) -------------------
   Every club's curated first-choice players and 4-man bench (GK/DEF/MID/ATT) stay exactly as
   written. To reach the requested 8-starter (GK+3DEF+2MID+2ATT) / 7-bench (1GK+2DEF+2MID+2ATT)
   structure without needing ~120 hand-verified extra transfer-window names, the additional
   depth signings below are procedurally generated club-style reserve players (clearly lower
   OVR than the real starters/bench), not claims about specific real individuals. */
const DEPTH_FIRST = ['A','B','C','D','E','F','G','H','J','K','L','M','N','O','P','R','S','T','V','Y'];
const DEPTH_LAST = ['Silva','Santos','Rossi','Bianchi','Müller','Schmidt','García','Fernández','Dubois','Martin','Johansson','Kowalski','Novak','Yılmaz','Costa','Almeida','Moreira','Ferreira','Rodrigues','Barros','Souza','Pereira','Oliveira','Araújo','Ramos','Lopes','Cunha','Teixeira','Correia','Machado'];
function generateDepthPlayer(pos, baseOvr, seed){
  const ovr = clamp(Math.round(baseOvr) + rnd(-5,3), 55, 88);
  const first = DEPTH_FIRST[seed % DEPTH_FIRST.length];
  const last = DEPTH_LAST[(seed*7) % DEPTH_LAST.length];
  const name = `${first}. ${last}`;
  const pac = clamp(ovr + rnd(-8,6), 40, 92);
  const dri = clamp(ovr + rnd(-10,6), 35, 90);
  const pas = clamp(ovr + rnd(-8,6), 40, 90);
  const sho = pos==='GK' ? rnd(25,40) : clamp(ovr + (pos==='ATT'? rnd(-6,8) : rnd(-16,0)), 25, 92);
  const def = pos==='ATT' ? clamp(ovr+rnd(-24,-6),25,70) : clamp(ovr+rnd(-4,8),40,94);
  const phy = clamp(ovr + rnd(-6,6), 45, 92);
  const p = P(name, pos, ovr, pac, dri, pas, sho, def, phy, rnd(2,4));
  p.age = rnd(20,32);
  return p;
}

/* ---------------------- REALISTIC MARKET VALUE FORMULA -------------------- */
/* Value is driven by OVR (exponential — elite ability is scarce), age (peak
   value around 21-27, steep decline afterwards), potential (young + already
   very good = extra premium), position (attackers & defenders carry a market
   premium over similarly-rated midfielders/keepers), star reputation for truly
   elite ratings, and current form/fitness. Deliberately NOT a flat OVR*OVR
   formula, so a young 84-OVR prospect can be worth more than an older 86-OVR
   player, and budgets (~€90-220M) can't buy a whole squad of superstars. */
function computePlayerValue(p){
  const ovr = p.ovr, age = p.age||24;
  const growth = 1.183, baseMult = 1.3;
  let base = baseMult * Math.pow(growth, ovr-65);
  let ageFactor;
  if(age<=20) ageFactor = 0.92;
  else if(age<=23) ageFactor = 1.15;
  else if(age<=27) ageFactor = 1.05;
  else if(age<=30) ageFactor = 0.82;
  else if(age<=33) ageFactor = 0.55;
  else ageFactor = 0.32;
  const potential = (age<23 && ovr>=82) ? 1.25 : ((age<26 && ovr>=85) ? 1.08 : 1.0);
  const posFactor = {ATT:1.12, MID:1.0, DEF:1.18, GK:0.85}[p.pos] || 1.0;
  const starFactor = ovr>=91 ? 1.55 : (ovr>=88 ? 1.2 : (ovr>=84 ? 1.0 : 0.92));
  const formFactor = 0.92 + ((p.form||70)/100)*0.16;
  let value = base*ageFactor*potential*posFactor*starFactor*formFactor;
  value = Math.max(3, Math.min(260, value));
  return Math.round(value*2)/2; // nearest half-million
}

/* ---------------------- CLUB TIER SYSTEM (display + narrative only) ------
   The match engine never reads tier labels directly — every result already
   emerges from real player/team stats (OVR, position quality, GK ability,
   formation, tactics, stamina, home advantage). Tiers are a readable summary
   of that same underlying strength for the UI, computed from the same
   numbers, so they can never contradict what the simulation actually does. */
function teamCompositeScore(t){ return t.budget*0.55 + avgOvr(t)*3 + t.rep*0.6; }
function computeTierMap(teams){
  const sorted = teams.slice().sort((a,b)=> teamCompositeScore(b)-teamCompositeScore(a));
  const map = {};
  sorted.forEach((t,i)=>{
    let tier;
    if(i<6) tier='S'; else if(i<16) tier='A'; else if(i<28) tier='B'; else tier='C';
    map[t.id]=tier;
  });
  return map;
}
const TIER_INFO = {
  S:{label:'TIER S — קבוצת-על', emoji:'🟣', color:'#b967ff'},
  A:{label:'TIER A — קבוצה חזקה', emoji:'🔵', color:'#2ea9ff'},
  B:{label:'TIER B — קבוצה טובה', emoji:'🟢', color:'#22c17a'},
  C:{label:'TIER C — קבוצה מתפתחת', emoji:'🟡', color:'#e8b94b'},
};
function tierBadgeHtml(t){
  const info = TIER_INFO[t.tier || 'B'];
  return `<span style="display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; color:${info.color}; border:1px solid ${info.color}; border-radius:6px; padding:2px 7px;">${info.emoji} ${t.tier || 'B'}</span>`;
}

/* ---------------------- PLAYER AVATARS (procedural, no external images) ----------------------
   No photo hosting/lookup exists for hundreds of players, and using unrelated stock photos would
   be misleading. Instead every player gets an instant, zero-network inline SVG silhouette,
   colour-coded by position — professional-looking, never "broken", and free to swap for a real
   photo pipeline later (just replace this one function). */
const AVATAR_COLORS = {GK:'#e8b94b', DEF:'#2ea9ff', MID:'#22c17a', ATT:'#ff7a45'};
function avatarSvg(pos, size){
  size = size||40;
  const bg = AVATAR_COLORS[pos] || '#5f776b';
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" style="border-radius:50%; background:${bg}; flex-shrink:0; display:block;">
    <circle cx="20" cy="16" r="7.5" fill="rgba(7,19,15,.32)"/>
    <path d="M5 37 C5 24 35 24 35 37 Z" fill="rgba(7,19,15,.32)"/>
  </svg>`;
}
function avatarHtml(player, size){
  return avatarSvg(player? player.pos : null, size);
}

  const data = loadFeedbackData();

  data.review = document.getElementById('fbReview').value.trim();
  data.improvement = document.getElementById('fbImprovement').value.trim();

function submitSuggestion(){
  const input = document.getElementById('fbIdea');
  const text = input.value.trim();
  if(!text) return;
  const data = loadFeedbackData();
  const id = 'u'+Date.now();
  data.suggestions.push({id, text, votes:1, votedByMe:true, mine:true});
  saveFeedbackData(data);
  renderFeedbackScreen();
  const note = document.getElementById('fbIdeaSubmitted');
  if(note){ note.style.display='block'; }

  const data = loadFeedbackData();
  const s = data.suggestions.find(x=>x.id===id);
  if(!s || s.votedByMe) return;
  s.votes++;
  s.votedByMe = true;
  saveFeedbackData(data);
  renderFeedbackScreen();
}

function startNewCareer(){
  TEAMS = baseTeams().map((t,i)=>{
    if(!t.bench || !t.bench.length) t.bench = makeBench(i+1); // fallback only if a club has no curated real bench
    t.players.forEach(p=>{ p.age = NAME_AGE[p.name] || p.age; p.value = computePlayerValue(p); });
    t.bench.forEach(p=>{ p.age = NAME_AGE[p.name] || rnd(19,33); p.value = computePlayerValue(p); });
    expandSquadDepth(t, i);
    return t;
  });
  const tierMap = computeTierMap(TEAMS);
  TEAMS.forEach(t=> t.tier = tierMap[t.id]);
  selectedTeamId = null;
  renderTeamGrid();
  showScreen('teamselect');
}
/* -------------------------- PLAYER DEVELOPMENT (season-to-season) -------------------------- */
function developPlayer(p, stat){
  if(p.potential===undefined) p.potential = clamp(p.ovr + (p.age<23? rnd(5,15) : rnd(0,4)), p.ovr, 96);
  const apps = stat ? stat.ratingCount : 0;
  const avgRating = (stat && stat.ratingCount) ? stat.ratingSum/stat.ratingCount : 6.0;
  const playedEnough = apps>=5;
  let delta = 0;
  if(p.age<=23){ // rapid development window
    let growth = playedEnough ? rnd(1,4) : rnd(0,1);
    if(avgRating>=7.2) growth += 1;
    delta = Math.min(growth, Math.max(0, p.potential-p.ovr));
  } else if(p.age<=29){ // prime — small performance-based fluctuation
    delta = avgRating>=7.5 ? rnd(0,1) : (avgRating<5.8 ? -rnd(0,1) : 0);
  } else if(p.age<=32){ // early decline
    delta = -rnd(0,2);
  } else { // late decline
    delta = -rnd(1,4);
  }
  p.ovr = clamp(p.ovr+delta, 45, 96);
  p.age += 1;
  p.value = computePlayerValue(p);
}
function developAllPlayersForNewSeason(){
  career.teams.forEach(t=>{
    [...t.players, ...t.bench].forEach(p=>{
      const stat = (career.seasonStats||{})[t.id+'::'+p.name];
      developPlayer(p, stat);
    });
  });
  const tierMap = computeTierMap(career.teams);
  career.teams.forEach(t=> t.tier = tierMap[t.id]);
}

/* Grows a 7-a-side squad (GK+2DEF+2MID+2ATT, 4-man bench) into the requested
   8 starters (GK+3DEF+2MID+2ATT) + 7 bench (1GK+2DEF+2MID+2ATT) = 15 total. */
function expandSquadDepth(t, seed){
  if(t.players.length>=8) return; // already expanded (e.g. loaded from an old save that ran this once)
  const defOvrAvg = Math.round(t.players.filter(p=>p.pos==='DEF').reduce((a,p)=>a+p.ovr,0)/2);
  const midOvrAvg = Math.round(t.players.filter(p=>p.pos==='MID').reduce((a,p)=>a+p.ovr,0)/2);
  const attOvrAvg = Math.round(t.players.filter(p=>p.pos==='ATT').reduce((a,p)=>a+p.ovr,0)/2);
  const newStartDef = generateDepthPlayer('DEF', defOvrAvg-3, seed*17+1);
  newStartDef.value = computePlayerValue(newStartDef);
  const gkIdx = t.players.findIndex(p=>p.pos==='GK');
  const lastDefIdx = t.players.map(p=>p.pos).lastIndexOf('DEF');
  t.players.splice(lastDefIdx+1, 0, newStartDef); // GK,DEF,DEF(new),MID,MID,ATT,ATT

  const extraBench = [
    generateDepthPlayer('DEF', defOvrAvg-9, seed*17+2),
    generateDepthPlayer('MID', midOvrAvg-9, seed*17+3),
    generateDepthPlayer('ATT', attOvrAvg-9, seed*17+4),
  ];
  extraBench.forEach(p=> p.value = computePlayerValue(p));
  t.bench = t.bench.concat(extraBench);
}
function seasonGoalFor(t){
  if(t.budget>=150) return 'אליפות הליגה והגביעים';
  if(t.budget>=90) return 'מקום באירופה';
  if(t.budget>=55) return 'אמצע הטבלה בבטחה';
  return 'הישרדות בליגה';
}

function avgOvr(t){ return Math.round(t.players.reduce((a,p)=>a+p.ovr,0)/t.players.length); }

  if(!selectedTeamId) return;
  setupTwoLeagues();
  const my = TEAMS.find(t=>t.id===selectedTeamId);
  career = {
    myTeamId: selectedTeamId,
    season: 1,
    budget: my.budget,
    reputation: my.rep,
    teams: TEAMS, // includes squads/bench/values (mutable over career)
    leagueA: TEAMS.filter(t=>t.league==='A').map(t=>t.id),
    leagueB: TEAMS.filter(t=>t.league==='B').map(t=>t.id),

  };
  saveCareer();
  showScreen('dashboard');

}
function setupTwoLeagues(){
  // Top 15 clubs by starting budget → ליגת האלופות (League A). Bottom 15 → ליגת העל (League B).
  const sorted = TEAMS.slice().sort((a,b)=> b.budget-a.budget);
  sorted.forEach((t,i)=>{ t.league = i<15 ? 'A' : 'B'; });
}
function continueCareer(){
  const c = loadCareer();
  if(!c){ alert('לא נמצאה קריירה שמורה.'); return; }
  career = c;
  TEAMS = career.teams;
  if(!TEAMS[0] || !TEAMS[0].tier){ // backward compatibility with saves from before the tier system
    const tierMap = computeTierMap(TEAMS);
    TEAMS.forEach(t=> t.tier = tierMap[t.id]);
  }
  if(!TEAMS[0].league || !career.leagueA){ // backward compatibility with saves from before the two-league system
    setupTwoLeagues();
    career.leagueA = TEAMS.filter(t=>t.league==='A').map(t=>t.id);
    career.leagueB = TEAMS.filter(t=>t.league==='B').map(t=>t.id);
    career.fixturesA = generateRoundRobin(career.leagueA);
    career.fixturesB = generateRoundRobin(career.leagueB);
    // best-effort carry the existing single table into whichever league the user's team ended up in
    const myLg = myTeam().league;
    const oldTable = career.table || TEAMS.map(t=>({id:t.id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
    career.tableA = career.leagueA.map(id=> oldTable.find(r=>r.id===id) || {id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
    career.tableB = career.leagueB.map(id=> oldTable.find(r=>r.id===id) || {id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
    career.calendarDate = career.calendarDate || {y:2026, m:8, d:15};
    career.cup = career.cup || null;
    career.news = career.news || [];
  }
  showScreen('dashboard');
  renderDashboard();
}

/* --------------------------- LEAGUE HELPERS ------------------------------ */
function myLeagueId(){ return myTeam().league; }
function otherLeagueId(){ return myLeagueId()==='A' ? 'B' : 'A'; }
function myFixtures(){ return myLeagueId()==='A' ? career.fixturesA : career.fixturesB; }
function otherFixtures(){ return otherLeagueId()==='A' ? career.fixturesA : career.fixturesB; }
function myTableArr(){ return myLeagueId()==='A' ? career.tableA : career.tableB; }
function otherTableArr(){ return otherLeagueId()==='A' ? career.tableA : career.tableB; }
function leagueName(id){ return id==='A' ? 'ליגת האלופות' : 'ליגת העל'; }
function tableFor(leagueId){ return leagueId==='A' ? career.tableA : career.tableB; }
function fixturesFor(leagueId){ return leagueId==='A' ? career.fixturesA : career.fixturesB; }

/* ---------------------- ROUND ROBIN FIXTURE GENERATOR -------------------- */
function generateRoundRobin(ids){
  let arr = ids.slice();
  if(arr.length%2!==0) arr.push(null);
  const n = arr.length;
  const rounds=[];
  for(let r=0;r<n-1;r++){
    const round=[];
    for(let i=0;i<n/2;i++){
      const a=arr[i], b=arr[n-1-i];
      if(a!==null && b!==null){
        if(r%2===0) round.push([a,b]); else round.push([b,a]);
      }
    }
    rounds.push(round);
    arr.splice(1,0,arr.pop());
  }
  return rounds;
}

function sortedTable(leagueId){
  const table = leagueId ? tableFor(leagueId) : myTableArr();
  return table.slice().sort((a,b)=> b.pts-a.pts || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf);
}

function nextFixtureForMe(){
  const fixtures = myFixtures();
  for(let r=career.currentRound; r<fixtures.length; r++){
    const round = fixtures[r];
    const m = round.find(m=>m[0]===career.myTeamId || m[1]===career.myTeamId);
    if(m) return {roundIndex:r, match:m};
  }
  return null;
}
/* The single, unified "what's next" for the user's career — the game decides, not the user.
   A due King's Cup tie always takes priority over the next league round, exactly like a real
   fixture list: the cup slots into the calendar the moment it's drawn/advances, and once the
   user's club is out of the cup this simply falls back to the next league match. */
function nextEventForMe(){
  if(career.cup && career.cup.stage!=='DONE'){
    const tie = career.cup.matches.find(m=>m[0]===career.myTeamId||m[1]===career.myTeamId);
    if(tie) return {type:'cup', match:tie};
  }
  const nf = nextFixtureForMe();
  if(nf) return {type:'league', roundIndex:nf.roundIndex, match:nf.match};
  return null;
}
function playNextEvent(){
  const ev = nextEventForMe();
  if(!ev) return;
  if(ev.type==='cup') openCupPreview();
  else openMatchPreview(ev.roundIndex);
}

function calendarDateStr(offsetRounds){
  const base = career.calendarDate;
  const d = new Date(base.y, base.m-1, base.d);
  d.setDate(d.getDate() + 7*(offsetRounds||0));
  const months = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  return `${d.getDate()} ב${months[d.getMonth()]} ${d.getFullYear()}`;
}
function advanceCalendar(){
  const d = new Date(career.calendarDate.y, career.calendarDate.m-1, career.calendarDate.d);
  d.setDate(d.getDate()+7);
  career.calendarDate = {y:d.getFullYear(), m:d.getMonth()+1, d:d.getDate()};
}
function upcomingFixturesForMe(n){
  const fixtures = myFixtures();
  const out=[];
  for(let r=career.currentRound; r<fixtures.length && out.length<n; r++){
    const m = fixtures[r].find(mm=>mm[0]===career.myTeamId||mm[1]===career.myTeamId);
    if(m) out.push({roundIndex:r, match:m, offset:r-career.currentRound});
  }
  return out;
}

function startNewSeason(){
  // Promotion / relegation: bottom 2 of League A ⬇ to B, top 2 of League B ⬆ to A.
  const finalA = sortedTable('A'); // [worst..best] not needed, sortedTable is best-first
  const finalB = sortedTable('B');
  const relegated = finalA.slice(-2).map(r=>r.id);
  const promoted = finalB.slice(0,2).map(r=>r.id);
  relegated.forEach(id=> teamById(id).league='B');
  promoted.forEach(id=> teamById(id).league='A');

  career.seasonHistory = career.seasonHistory || [];
  career.seasonHistory.push({
    season: career.season,
    championAId: sortedTable('A')[0] ? sortedTable('A')[0].id : null,
    championA: sortedTable('A')[0] ? teamById(sortedTable('A')[0].id).name : null,
    championBId: sortedTable('B')[0] ? sortedTable('B')[0].id : null,
    championB: sortedTable('B')[0] ? teamById(sortedTable('B')[0].id).name : null,
    cupChampionId: (career.cup && career.cup.champion) ? career.cup.champion : null,
    cupChampion: (career.cup && career.cup.champion) ? teamById(career.cup.champion).name : null,
    topScorer: statLeaders('goals')[0] ? statLeaders('goals')[0].name : null,
  });

  pushNews(`⬆️ עלו ל-${leagueName('A')}: ${promoted.map(id=>teamById(id).name).join(', ')}`);
  pushNews(`⬇️ ירדו ל-${leagueName('B')}: ${relegated.map(id=>teamById(id).name).join(', ')}`);

  career.season++;
  career.currentRound=0;
  career.leagueA = career.teams.filter(t=>t.league==='A').map(t=>t.id);
  career.leagueB = career.teams.filter(t=>t.league==='B').map(t=>t.id);
  career.fixturesA = generateRoundRobin(career.leagueA);
  career.fixturesB = generateRoundRobin(career.leagueB);
  career.tableA = career.leagueA.map(id=>({id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
  career.tableB = career.leagueB.map(id=>({id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
  career.cup = null;
  career.seasonStats = career.seasonStats || {};
  developAllPlayersForNewSeason();
  career.seasonStats = {};
  career.resultsLog = [];
  career.teams.forEach(t=> t.players.forEach(p=>{p.stamina=100; p.cards=0; p.suspended=false;}));
  competitionView = null;
  saveCareer();
  showScreen('dashboard');
  renderDashboard();
}

function trophyCountFor(teamId){
  const h = career.seasonHistory||[];
  return {
    leagueA: h.filter(x=>x.championAId===teamId).length,

function cupBodyHtml(){
  if(!career.cup){
    return `<div class="match-cta"><span style="color:var(--text-dim);">👑 גביע המלך ייפתח לאחר 5 מחזורי ליגה (כרגע בסיבוב ${career.currentRound}).</span></div>`;
  }
  const c = career.cup;
  const stages = ['R16','QF','SF','F'];
  function tieCardHtml(homeId, awayId, hs, as, winnerId, note){
    const h=teamById(homeId), a=teamById(awayId);
    const decided = winnerId!==undefined;
    return `<div class="sub-row" style="flex-direction:column; align-items:stretch; gap:2px; min-width:150px;">
      <div style="display:flex; justify-content:space-between; ${decided&&winnerId===homeId?'color:var(--green); font-weight:700;':''}"><span>${h?h.short:'TBD'}</span><span>${decided?hs:''}</span></div>
      <div style="display:flex; justify-content:space-between; ${decided&&winnerId===awayId?'color:var(--green); font-weight:700;':''}"><span>${a?a.short:'TBD'}</span><span>${decided?as:''}</span></div>
      ${note?`<div style="font-size:10px; color:var(--text-dim-2); text-align:center;">${note}</div>`:''}
    </div>`;
  }
  const columns = stages.map(stage=>{
    const done = (c.roundsHistory && c.roundsHistory[stage]) || [];
    let cardsHtml;
    if(stage===c.stage && c.stage!=='DONE'){
      // mix decided ties (from history) with still-pending ones (from c.matches)
      const pendingCards = c.matches.map(m=> tieCardHtml(m[0], m[1], null, null, undefined, m[0]===career.myTeamId||m[1]===career.myTeamId?'המשחק שלך':null));
      const doneCards = done.map(x=> tieCardHtml(x.home, x.away, x.homeScore, x.awayScore, x.winner, x.shootout));
      cardsHtml = doneCards.join('') + pendingCards.join('');
    } else if(done.length){
      cardsHtml = done.map(x=> tieCardHtml(x.home, x.away, x.homeScore, x.awayScore, x.winner, x.shootout)).join('');
    } else {
      cardsHtml = `<div class="sub-row" style="color:var(--text-dim-2); font-size:11px; text-align:center;">טרם הוגרל</div>`;
    }
    return `<div style="flex:1; min-width:160px;">
      <h4 style="font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; text-align:center;">${CUP_STAGE_NAMES[stage]}</h4>
      <div style="display:flex; flex-direction:column; gap:8px;">${cardsHtml}</div>
    </div>`;
  }).join('<div style="width:1px; background:var(--line); align-self:stretch;"></div>');
  const championHtml = c.stage==='DONE' ? `<div class="motm">🏆 KING'S CUP CHAMPION<br>${teamById(c.champion).name}</div>` : '';
  return `<div style="display:flex; gap:14px; overflow-x:auto; padding-bottom:10px;">${columns}</div>${championHtml}`;
}

const WEEKDAYS_HE = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
function calendarWeekdayStr(offsetRounds){
  const base = career.calendarDate;
  const d = new Date(base.y, base.m-1, base.d);
  d.setDate(d.getDate() + 7*(offsetRounds||0));
  return WEEKDAYS_HE[d.getDay()];
}
function renderCalendarTab(){

      resultTxt = res ? `✅ FINAL: ${res.homeId===t.id? res.hg+'-'+res.ag : res.ag+'-'+res.hg}` : '✅ FINAL';

      <div id="negoResult" style="margin-top:12px; font-size:14px; color:var(--text-dim);"></div>
      <div class="modal-actions">
        <button class="btn btn-primary btn-sm" onclick="submitOffer('${teamId}','${playerName.replace(/'/g,"\\'")}')">SEND OFFER</button>
        <button class="btn btn-ghost btn-sm" onclick="closeModal()">סגור</button>
      </div>
    </div>
  </div>`;

function closeModal(){ document.getElementById('modalRoot').innerHTML=''; negoState=null; }
function submitOffer(teamId, playerName){
  const team = teamById(teamId);
  const isBench = team.bench.some(p=>p.name===playerName);
  const player = isBench? team.bench.find(p=>p.name===playerName) : team.players.find(p=>p.name===playerName);
  const amount = parseFloat(document.getElementById('offerAmount').value)||0;
  const resultBox = document.getElementById('negoResult');
  if(amount > career.budget){
    resultBox.innerHTML = `<span style="color:var(--red)">אין מספיק תקציב.</span>`; return;
  }
  if(!negoState || negoState.teamId!==teamId || negoState.playerName!==playerName){
    negoState = { teamId, playerName, round:0, ask: Math.round(player.value*1.1*2)/2 };
  }
  const ask = negoState.ask;

  if(amount >= ask*0.985){
    // ACCEPT — deal closes at the offered amount
    if(isBench) team.bench = team.bench.filter(p=>p!==player); else team.players = team.players.filter(p=>p!==player);
    const my = myTeam();
    my.bench.push(player);
    career.budget -= amount; team.budget += amount;
    resultBox.innerHTML = `<span style="color:var(--green)">ACCEPT! ${player.name} הצטרף לקבוצה שלך תמורת €${amount}M.</span>`;
    saveCareer();
    negoState=null;
    setTimeout(()=>{ closeModal(); renderDashboard(); }, 900);
    return;
  }
  negoState.round++;
  if(negoState.round > 4){
    resultBox.innerHTML = `<span style="color:var(--red)">REJECT: המועדון מסרב להמשיך במשא ומתן. ההצעה הסופית שלהם הייתה €${ask}M.</span>`;
    return;
  }
  const gapRatio = amount/ask;
  if(gapRatio < 0.7){
    resultBox.innerHTML = `<span style="color:var(--red)">"Too low." — ${team.name} דוחה את ההצעה, היא נמוכה מדי ביחס לשווי השחקן.</span>`;
    return;
  }
  // club narrows the gap but keeps a premium above market value
  const newAsk = Math.max(player.value, Math.round((ask - (ask-amount)*0.42)*2)/2);
  negoState.ask = newAsk;
  resultBox.innerHTML = `<span style="color:var(--yellow)">"Too low." ${team.name} מציעה נגד: <b style="color:var(--gold)">€${newAsk}M</b></span>
    <button class="btn btn-sm btn-blue" style="margin-top:8px;" onclick="document.getElementById('offerAmount').value=${newAsk};">הצע €${newAsk}M</button>`;
}

let sellNego = null; // {playerName, round, buyerName, ask}
function openSellModal(playerName){
  const {player} = findMyPlayer(playerName);
  if(!player) return;
  // guard: keep at least one GK and at least 6 players total in the squad
  const t = myTeam();
  const totalPlayers = t.players.length + t.bench.length;

  }

  sellNego = { playerName, round:0, buyerName: buyer? buyer.name : 'שוק העברות', buyerId: buyer? buyer.id : null,
    offer: Math.round(player.value*(0.75+Math.random()*0.20)*2)/2 };

function pickPlausibleBuyer(player, excludeTeamId){
  // Weighted toward clubs whose budget comfortably fits the player's value — feels smarter than a pure coinflip.
  const candidates = career.teams.filter(t=> t.id!==excludeTeamId && t.budget >= player.value*0.5);
  if(!candidates.length) return null;
  candidates.sort((a,b)=> Math.abs(a.budget-player.value*1.3) - Math.abs(b.budget-player.value*1.3));
  return candidates[rnd(0, Math.min(2, candidates.length-1))];
}
/* When a starter leaves the squad (sold, or an accepted incoming offer), the best matching
   bench player — same position first, so a backup GK auto-replaces a departing GK — takes
   their spot in the lineup automatically, keeping the starting XI always full. */
function autoFillStarterSlot(t, idx, vacatedPos){
  if(!t.bench.length) { t.players.splice(idx,1); return; } // no one to promote (shouldn't normally happen — sell guard prevents it)
  let repIdx = t.bench.findIndex(p=>p.pos===vacatedPos);
  if(repIdx<0) repIdx = 0;
  t.players[idx] = t.bench[repIdx];
  t.bench.splice(repIdx,1);
}
function removeStarter(t, player){
  const idx = t.players.indexOf(player);
  if(idx>=0) autoFillStarterSlot(t, idx, player.pos);
}
function acceptSellOffer(playerName){
  const {t, isBench, player} = findMyPlayer(playerName);
  if(!player || !sellNego) return;
  const amount = sellNego.offer;
  if(isBench) t.bench = t.bench.filter(p=>p!==player); else removeStarter(t, player);
  career.budget += amount;
  const buyer = sellNego.buyerId? teamById(sellNego.buyerId) : null;
  if(buyer){ buyer.budget -= amount; buyer.bench.push(player); }
  pushTransferNews(`${player.name} עבר מ-${t.name} ל-${sellNego.buyerName} תמורת €${amount}M`);
  document.getElementById('sellResult').innerHTML = `<span style="color:var(--green)">נמכר! ${player.name} עזב תמורת €${amount}M.</span>`;
  saveCareer();
  sellNego=null;
  setTimeout(()=>{ closeModal(); renderDashboard(); }, 900);
}
function negotiateSellOffer(playerName){
  const {player} = findMyPlayer(playerName);
  if(!player || !sellNego) return;
  sellNego.round++;
  const resultBox = document.getElementById('sellResult');
  if(sellNego.round > 3){
    resultBox.innerHTML = `<span style="color:var(--red)">${sellNego.buyerName} לא מוכנה להעלות יותר. ההצעה הסופית: €${sellNego.offer}M.</span>`;
    return;
  }
  const raise = Math.round(sellNego.offer * (0.06+Math.random()*0.08) * 2)/2;
  sellNego.offer = Math.min(player.value*1.15, sellNego.offer + raise);
  sellNego.offer = Math.round(sellNego.offer*2)/2;
  document.getElementById('sellOfferBox').querySelector('div:last-child').textContent = `€${sellNego.offer}M`;
  resultBox.innerHTML = `<span style="color:var(--yellow)">${sellNego.buyerName} מעלה את ההצעה ל-€${sellNego.offer}M.</span>`;
}

function maybeGenerateIncomingOffer(){
  const t = myTeam();
  const listed = [...t.players, ...t.bench].filter(p=>p.listed);
  const pool = listed.length? listed : [...t.players, ...t.bench];
  if(!pool.length) return;
  if(Math.random() > (listed.length? 0.55 : 0.15)) return; // listed players attract offers far more often
  const player = pool[rnd(0, pool.length-1)];
  const buyer = pickPlausibleBuyer(player, t.id);
  if(!buyer) return;
  const offer = Math.round(player.value*(0.75+Math.random()*0.30)*2)/2;
  showIncomingOfferModal(player.name, buyer.id, offer);
}

function pushTransferNews(text){
  if(!career.transferNews) career.transferNews=[];
  career.transferNews.unshift(text);
  if(career.transferNews.length>8) career.transferNews.length=8;
}
function maybeRunAiToAiTransfer(){
  if(Math.random()>0.35) return; // keeps the market active without a transfer every single round
  const sellers = career.teams.filter(t=>t.id!==career.myTeamId);
  const seller = sellers[rnd(0, sellers.length-1)];
  const sellablePool = [...seller.players, ...seller.bench].filter(p=>seller.players.length+seller.bench.length>7 || seller.bench.includes(p));
  const pool = seller.bench.length? seller.bench : sellablePool;
  if(!pool.length) return;
  const player = pool[rnd(0, pool.length-1)];
  const buyer = pickPlausibleBuyer(player, seller.id);
  if(!buyer || buyer.budget < player.value*0.7) return;
  const price = Math.round(player.value*(0.85+Math.random()*0.25)*2)/2;
  if(price > buyer.budget) return;
  seller.bench = seller.bench.filter(p=>p!==player);
  buyer.budget -= price; seller.budget += price;
  buyer.bench.push(player);
  pushTransferNews(`${player.name} עבר מ-${seller.name} ל-${buyer.name} תמורת €${price}M`);
}

function dropOnSlot(targetIdx){
  const t = myTeam();
  if(!dragState) return;
  if(dragState.from==='bench'){
    const benchPlayer = t.bench[dragState.index];
    const isGkSlot = targetIdx===0;
    if(isGkSlot && benchPlayer.pos!=='GK'){ dragState=null; return; } // only a GK can go in goal
    if(!isGkSlot && benchPlayer.pos==='GK'){ dragState=null; return; } // a GK can't play outfield
    const outgoing = t.players[targetIdx];
    t.players[targetIdx] = benchPlayer;
    t.bench[dragState.index] = outgoing;
  } else if(dragState.from==='pitch'){
    const i = dragState.index;
    if(i===targetIdx){ dragState=null; return; }
    // Swapping two starters is fine as long as it never puts a non-GK in goal or a GK outfield.
    if(targetIdx===0 && t.players[i].pos!=='GK'){ dragState=null; return; }
    if(i===0 && t.players[targetIdx].pos!=='GK'){ dragState=null; return; }
    const tmp = t.players[targetIdx];
    t.players[targetIdx] = t.players[i];
    t.players[i] = tmp;
  }
  dragState=null;
  saveCareer();
  renderPreviewPitch(); renderPreviewBench();
}
function dropOnBench(targetBenchIdx){
  // Swap a bench player directly into another bench slot (reordering only)
  const t = myTeam();
  if(!dragState || dragState.from!=='bench') { dragState=null; return; }
  const tmp = t.bench[targetBenchIdx];
  t.bench[targetBenchIdx] = t.bench[dragState.index];
  t.bench[dragState.index] = tmp;
  dragState=null;
  saveCareer();
  renderPreviewBench();
}

function recordSeasonStats(){
  if(!career.seasonStats) career.seasonStats={};
  const key=(teamId,name)=> teamId+'::'+name;
  function ensure(teamId,name,pos){
    const k=key(teamId,name);
    if(!career.seasonStats[k]) career.seasonStats[k]={name,teamId,pos,goals:0,assists:0,yellow:0,red:0,ratingSum:0,ratingCount:0,cleanSheets:0};
    return career.seasonStats[k];
  }
  const allFinalPlayers = [...M.home.players, ...M.away.players];
  function posOf(name){ const f=allFinalPlayers.find(p=>p.name===name); return f?f.pos:'?'; }
  M.homeGoalsLog.forEach(g=>{
    ensure(M.home.team.id,g.scorer,posOf(g.scorer)).goals++;
    if(g.assist) ensure(M.home.team.id,g.assist,posOf(g.assist)).assists++;
  });
  M.awayGoalsLog.forEach(g=>{
    ensure(M.away.team.id,g.scorer,posOf(g.scorer)).goals++;
    if(g.assist) ensure(M.away.team.id,g.assist,posOf(g.assist)).assists++;
  });
  (M.cardLog||[]).forEach(c=>{
    const rec = ensure(c.teamId,c.name,posOf(c.name));
    if(c.type==='yellow') rec.yellow++; else rec.red++;
  });
  M.home.players.forEach(p=>{
    const rec = ensure(M.home.team.id, p.name, p.pos);
    const rating = Math.max(4, Math.min(10, Math.round((6+p.mScore*0.13)*10)/10));
    rec.ratingSum += rating; rec.ratingCount++;
  });
  M.away.players.forEach(p=>{
    const rec = ensure(M.away.team.id, p.name, p.pos);
    const rating = Math.max(4, Math.min(10, Math.round((6+p.mScore*0.13)*10)/10));
    rec.ratingSum += rating; rec.ratingCount++;
  });
  if(M.away.goals===0 && M.home.startingGK) ensure(M.home.team.id, M.home.startingGK, 'GK').cleanSheets++;
  if(M.home.goals===0 && M.away.startingGK) ensure(M.away.team.id, M.away.startingGK, 'GK').cleanSheets++;
}
function statLeaders(field, opts){
  opts = opts||{};
  const rows = Object.values(career.seasonStats||{});
  if(field==='rating'){
    return rows.filter(r=>r.ratingCount>=(opts.minApps||1))
      .map(r=>({...r, value: r.ratingSum/r.ratingCount}))
      .sort((a,b)=>b.value-a.value).slice(0,10);
  }
  return rows.filter(r=> field==='cleanSheets' ? r.pos==='GK' : true)
    .map(r=>({...r, value:r[field]}))
    .sort((a,b)=>b.value-a.value).slice(0,10);
}


const CUP_STAGE_NAMES = {R16:'Round of 16', QF:'Quarter Finals', SF:'Semi Finals', F:'Final', DONE:'הסתיים'};
function shuffleArray(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pushNews(text){
  if(!career.news) career.news=[];
  career.news.unshift(text);
  if(career.news.length>8) career.news.length=8;
}
function maybeDrawCup(){
  if(career.cup) return; // already drawn this season
  if(career.currentRound < 5) return;
  const top8 = (leagueId)=> sortedTable(leagueId).slice(0,8).map(r=>r.id);
  const pool = shuffleArray([...top8('A'), ...top8('B')]);
  const matches=[];
  for(let i=0;i<pool.length;i+=2) matches.push([pool[i], pool[i+1]]);
  career.cup = {stage:'R16', matches, winners:[], champion:null, drawnAtRound:career.currentRound};
  pushNews("🏆 KING'S CUP DRAW — הגרלת גביע המלך התקיימה! 16 קבוצות, שלב Round of 16.");
  saveCareer();
  maybeAutoAdvanceCup();
}
function resolveCupTie(homeId, awayId, winnerId){
  const idx = career.cup.matches.findIndex(m=> (m[0]===homeId&&m[1]===awayId) || (m[0]===awayId&&m[1]===homeId));
  if(idx>=0) career.cup.matches.splice(idx,1);
  career.cup.winners.push(winnerId);
  if(career.cup.matches.length===0){
    if(career.cup.stage==='F'){
      career.cup.champion = winnerId;
      career.cup.stage='DONE';
      pushNews(`🏆 ${teamById(winnerId).name} זכתה בגביע המלך!`);
    } else {
      const nextStageMap = {R16:'QF', QF:'SF', SF:'F'};
      career.cup.stage = nextStageMap[career.cup.stage];
      const shuffled = shuffleArray(career.cup.winners);
      const newMatches=[];
      for(let i=0;i<shuffled.length;i+=2) newMatches.push([shuffled[i], shuffled[i+1]]);
      career.cup.matches = newMatches;
      career.cup.winners = [];
      pushNews(`👑 גביע המלך ממשיך לשלב ${CUP_STAGE_NAMES[career.cup.stage]}!`);
    }
  }
}
function finalizeCupMatch(){
  const homeId = M.home.team.id, awayId = M.away.team.id;
  let winnerId;
  if(M.shootout){ winnerId = M.shootout.winnerSide==='home'? homeId : awayId; }
  else { winnerId = M.home.goals>M.away.goals? homeId : awayId; }
  const prizeMap = {R16:4, QF:7, SF:12, F:20};
  const prize = prizeMap[career.cup.stage] || 4;
  const winner = teamById(winnerId);
  winner.budget += prize;
  if(winnerId===career.myTeamId) career.budget += prize;
  if(!career.cup.roundsHistory) career.cup.roundsHistory = {};
  if(!career.cup.roundsHistory[career.cup.stage]) career.cup.roundsHistory[career.cup.stage] = [];
  career.cup.roundsHistory[career.cup.stage].push({
    home:homeId, away:awayId, homeScore:M.home.goals, awayScore:M.away.goals, winner:winnerId,
    shootout: M.shootout ? `${M.shootout.home}-${M.shootout.away} pens` : (M.extraTimePlayed? 'aet' : null),
  });
  resolveCupTie(homeId, awayId, winnerId);
}
function resolveOtherCupTies(myMatch){
  if(!career.cup) return;
  const others = career.cup.matches.filter(m=> !(m[0]===myMatch[0] && m[1]===myMatch[1]));
  others.forEach(m=>{
    if(!career.cup.matches.some(x=>x[0]===m[0]&&x[1]===m[1])) return; // may already have been resolved
    const h=teamById(m[0]), a=teamById(m[1]);
    if(!h||!a) return;
    runQuickSim(h,a,0,true);
  });
}
function maybeAutoAdvanceCup(){
  if(!career.cup || career.cup.stage==='DONE') return;
  let guard=0;
  while(career.cup && career.cup.stage!=='DONE' && guard<20){
    const inCup = career.cup.matches.some(m=> m[0]===career.myTeamId || m[1]===career.myTeamId);
    if(inCup) break;
    const matches = career.cup.matches.slice();
    if(!matches.length) break;
    matches.forEach(m=>{
      if(!career.cup.matches.some(x=>x[0]===m[0]&&x[1]===m[1])) return;
      const h=teamById(m[0]), a=teamById(m[1]);
      if(!h||!a) return;
      runQuickSim(h,a,0,true);
    });
    guard++;
  }
  saveCareer();
}

function quickSimAndRecord(homeId, awayId, roundIndex){
  const h = teamById(homeId), a = teamById(awayId);
  const hs = avgOvr(h)+rnd(-6,10), as = avgOvr(a)+rnd(-6,8);
  const diff = (hs-as)/8;
  const hg = Math.max(0, Math.round(rndPoisson(1.2+diff*0.25)));
  const ag = Math.max(0, Math.round(rndPoisson(1.0-diff*0.25)));
  recordResult(homeId, awayId, hg, ag, roundIndex);
}
function rndPoisson(lambda){
  let L=Math.exp(-lambda), k=0, p=1;
  do{ k++; p*=Math.random(); }while(p>L);
  return k-1;
}
function recordResult(homeId, awayId, hg, ag, roundIndex){
  const lg = teamById(homeId).league;
  const table = tableFor(lg);
  const hRow = table.find(r=>r.id===homeId), aRow = table.find(r=>r.id===awayId);
  hRow.p++; aRow.p++; hRow.gf+=hg; hRow.ga+=ag; aRow.gf+=ag; aRow.ga+=hg;
  if(hg>ag){hRow.w++; hRow.pts+=3; aRow.l++;}
  else if(hg<ag){aRow.w++; aRow.pts+=3; hRow.l++;}
  else {hRow.d++; aRow.d++; hRow.pts+=1; aRow.pts+=1;}
  if(!career.resultsLog) career.resultsLog=[];
  career.resultsLog.push({leagueId:lg, roundIndex, homeId, awayId, hg, ag});
}

/* ----------------------------- Match Setup ------------------------------- */
function formationSlots(shape){
  // x:0(own goal)-100(opp goal), y:0-60 ; mirrored for away team. Slot 0 is always the goalkeeper.
  // 8-a-side shape: GK + 3 DEF + 2 MID + 2 ATT.
  const shapes = {
    balanced:   [{pos:'GK',x:6,y:30},{pos:'DEF',x:20,y:12},{pos:'DEF',x:20,y:30},{pos:'DEF',x:20,y:48},{pos:'MID',x:46,y:20},{pos:'MID',x:46,y:40},{pos:'ATT',x:78,y:20},{pos:'ATT',x:78,y:40}],
    defensive:  [{pos:'GK',x:6,y:30},{pos:'DEF',x:18,y:12},{pos:'DEF',x:18,y:30},{pos:'DEF',x:18,y:48},{pos:'MID',x:40,y:24},{pos:'MID',x:46,y:38},{pos:'ATT',x:76,y:22},{pos:'ATT',x:76,y:38}],
    attacking:  [{pos:'GK',x:6,y:30},{pos:'DEF',x:24,y:14},{pos:'DEF',x:24,y:30},{pos:'DEF',x:24,y:46},{pos:'MID',x:52,y:18},{pos:'MID',x:52,y:42},{pos:'ATT',x:82,y:20},{pos:'ATT',x:82,y:40}],
  };
  return shapes[shape] || shapes.balanced;
}
function setupMatch(homeTeam, awayTeam, roundIndex, quickSim, durationMs, isCup){
  function buildSide(team, isHome){
    const shape = team.formationShape || 'balanced';
    const slots = formationSlots(shape);
    const players = team.players.map((p,i)=>{
      const slot = slots[i];
      const x = isHome? slot.x : PITCH_W-slot.x;
      const y = slot.y;
      return {
        ref:p, name:p.name, pos:p.pos, ovr:p.ovr, pac:p.pac, dri:p.dri, pas:p.pas, sho:p.sho, def:p.def, phy:p.phy,
        stamina:p.stamina, x, y, tx:x, ty:y, baseX:x, baseY:y, hasBall:false, cards:0, sentOff:false, injured:false,
        mScore:0, touches:0,
      };
    });
    return {team, isHome, players, shape, bench: team.bench.map(p=>({ref:p,...p})), subsUsed:0, goals:0, shots:0, shotsOnTarget:0,
      passes:0, passesOk:0, dribbles:0, tackles:0, corners:0, fouls:0, saves:0, cardsY:0, cardsR:0, possessionTicks:0,
      mentality:'balanced', press:'medium', assistCandidate:null, chain:[]};
  }
  const home = buildSide(homeTeam, true);
  const away = buildSide(awayTeam, false);
  home.startingGK = home.players[0] ? home.players[0].name : null;
  away.startingGK = away.players[0] ? away.players[0].name : null;
  const realDurationMs = durationMs || 60000;
  M = {
    home, away, roundIndex, quickSim: !!quickSim, isCup: !!isCup,
    minute:0, second:0, running:true, paused:false, finished:false, maxMinutes:90, extraTimePlayed:false,
    ball:{x:50,y:30, tx:50, ty:30, ownerSide:null, ownerIdx:null},
    // The full 90 simulated match-minutes are always shown on the clock (0'→90'), but the REAL time
    // it takes to get there is short and user-selectable (60s / 30s / 15s). Each gameTick() advances
    // the simulated clock by 20 game-seconds, so 3 ticks = 1 simulated minute = 270 ticks for 90 minutes.
    // tickInterval is therefore the chosen real duration spread across those 270 ticks.
    events:[], lastTickTime:0, tickInterval: realDurationMs/270, realDurationMs,
    homeGoalsLog:[], awayGoalsLog:[],
    motm:null, penaltyActive:false, shootout:null, cardLog:[],
  };
  if(!quickSim){
    document.getElementById('mhHome').innerHTML = `<div class="mh-crest" style="border-radius:50%;background:linear-gradient(135deg,${home.team.color1},${home.team.color2})"></div>${home.team.name}`;
    document.getElementById('mhAway').innerHTML = `${away.team.name}<div class="mh-crest" style="border-radius:50%;background:linear-gradient(135deg,${away.team.color1},${away.team.color2})"></div>`;
    updateScoreDisplay();
    document.getElementById('mhClock').textContent = "0'";
    document.getElementById('mhStatus').textContent = isCup? '👑 KING\'S CUP — קיק אוף' : 'קיק אוף';
    switchSideTab('events');
    document.getElementById('btnSpeed').textContent='⏱️ x1'; speedMultiplier=1;
  }
  logEvent(0,'⚽', isCup? '👑 משחק גביע המלך התחיל!' : 'המשחק התחיל!');
}

function updateScoreDisplay(){
  document.getElementById('mhScore').textContent = `${M.home.goals} - ${M.away.goals}`;
}
function fmtClock(){
  // Whole minutes only — no seconds shown anywhere on the clock.
  return `${Math.min(M.minute,90)}'`;
}

/* ----------------------------- Game Loop --------------------------------- */
function startMatchLoop(){
  let lastFrame = performance.now();
  function frame(now){
    if(!M || M.finished){ return; }
    const dt = now-lastFrame; lastFrame = now;
    if(!M.paused){
      animatePositions(dt);
      drawPitch();
      M.lastTickTime += dt*speedMultiplier;
      const tickLen = M.tickInterval;
      while(M.lastTickTime >= tickLen && !M.finished && !M.paused){
        M.lastTickTime -= tickLen;
        gameTick();
      }
    }
    document.getElementById('mhClock').textContent = fmtClock();
    animHandle = requestAnimationFrame(frame);
  }
  animHandle = requestAnimationFrame(frame);
}

function animatePositions(dt){
  const ease = Math.min(1, dt/260);
  [...M.home.players, ...M.away.players].forEach(pl=>{
    pl.x += (pl.tx-pl.x)*ease;
    pl.y += (pl.ty-pl.y)*ease;
  });
  M.ball.x += (M.ball.tx-M.ball.x)*ease;
  M.ball.y += (M.ball.ty-M.ball.y)*ease;
}

/* ----------------------------- Simulation Tick ---------------------------- */
const IN_MATCH_TIPS = [
  {minute:5, text:'💡 TIP: אתה יכול לבצע חילופים במהלך המשחק, בלשונית SUBS.'},
  {minute:40, text:'💡 TIP: נסה לשנות את המערך אם הקבוצה שלך מתקשה, בלשונית TACTICS.'},
];
function maybeShowTutorialTip(){
