function gameTick(){
  M.second += 20;
  if(M.second>=60){ M.second=0; M.minute++; }
  if(M.minute>=90 && M.isCup && !M.extraTimePlayed && M.home.goals===M.away.goals){
    // Cup ties can't end level — extend to 120' extra time before a shootout.
    M.extraTimePlayed = true;
    M.maxMinutes = 120;
    logEvent(90,'⏱️','90\' — תיקו! המשחק עובר להארכה (Extra Time, עד 120\')');
    if(!HEADLESS) showToast('⏱️ EXTRA TIME — 90 דקות רגילות הסתיימו בתיקו');
  }
  if(M.minute>=M.maxMinutes){
    if(M.isCup && M.home.goals===M.away.goals){
      runPenaltyShootout();
      return;
    }
    endMatch(); return;
  }
  decayStamina();
  resolvePossessionAction();
  if(M.ball.ownerSide) sideOf(M.ball.ownerSide).possessionTicks++;
  updateFormationTargets();
  refreshSidePanelIfNeeded();
  maybeShowTutorialTip();
}

function decayStamina(){
  // Tuned so shot quality stays meaningful across the full 90' (goals must be able to happen in
  // either half), while fatigue still noticeably favors fresh legs/substitutes late on.
  [...M.home.players, ...M.away.players].forEach(pl=>{
    if(pl.sentOff) return;
    pl.stamina = Math.max(60, pl.stamina - (0.05 + Math.random()*0.04));
  });
}

function sideOf(side){ return side==='home'? M.home : M.away; }
function oppOf(side){ return side==='home'? M.away : M.home; }

function nearestPlayer(side, x, y, excludeGK){
  let best=null, bd=Infinity;
  side.players.forEach((pl,i)=>{
    if(pl.sentOff) return;
    if(excludeGK && pl.pos==='GK') return;
    const d = dist(pl.x,pl.y,x,y);
    if(d<bd){bd=d; best={pl,idx:i};}
  });
  return best;
}
function dist(x1,y1,x2,y2){ return Math.hypot(x1-x2,y1-y2); }

function ensurePossession(){
  if(M.ball.ownerSide) return;
  const hd = nearestPlayer(M.home, M.ball.x, M.ball.y);
  const ad = nearestPlayer(M.away, M.ball.x, M.ball.y);
  const hDist = hd? dist(hd.pl.x,hd.pl.y,M.ball.x,M.ball.y) : Infinity;
  const aDist = ad? dist(ad.pl.x,ad.pl.y,M.ball.x,M.ball.y) : Infinity;
  if(hDist<=aDist){ setPossession('home', hd.idx, true); } else { setPossession('away', ad.idx, true); }
}
function setPossession(sideKey, idx, freshSpell){
  M.ball.ownerSide = sideKey; M.ball.ownerIdx = idx;
  const side = sideOf(sideKey);
  const pl = side.players[idx];
  M.ball.tx = pl.x; M.ball.ty = pl.y;
  if(freshSpell){ side.assistCandidate = null; side.chain = []; }
}

function resolvePossessionAction(){
  if(M.penaltyActive) return;
  ensurePossession();
  const sideKey = M.ball.ownerSide;
  const side = sideOf(sideKey);
  const opp = oppOf(sideKey);
  const pl = side.players[M.ball.ownerIdx];
  if(!pl || pl.sentOff){ M.ball.ownerSide=null; ensurePossession(); return; }

  const attackingRight = sideKey==='home';
  const goalX = attackingRight? PITCH_W : 0;
  const distToGoal = Math.abs(goalX-pl.x);
  const nearestDef = nearestPlayer(opp, pl.x, pl.y, true);
  const pressure = nearestDef? Math.max(0, 18-dist(pl.x,pl.y,nearestDef.pl.x,nearestDef.pl.y)) : 0;

  const staminaFactor = pl.stamina/100;
  let roll = Math.random()*100;

  // In shooting range?
  const inRange = distToGoal < 26;
  const shootScore = inRange ? (pl.sho*staminaFactor*0.7 + rnd(0,20)) : -1;
  const passScore = pl.pas*staminaFactor*0.55 + rnd(0,25);
  const dribbleScore = pl.dri*staminaFactor*0.6 + rnd(0,22) - pressure*1.4;

  if(shootScore > 44 && shootScore >= passScore*0.64 && Math.random()<0.073){
    attemptShot(sideKey, opp, pl);
    return;
  }
  // possible tackle from defender first
  if(nearestDef && dist(pl.x,pl.y,nearestDef.pl.x,nearestDef.pl.y) < 6){
    const tackleChance = (nearestDef.pl.def*0.6) - (pl.dri*0.4) + rnd(-15,15);
    opp.tackles++;
    if(tackleChance > 25){
      // foul chance
      if(Math.random()<0.16){
        commitFoul(opp, nearestDef, side, pl);
        return;
      }
      // successful tackle -> possession change
      nearestDef.pl.mScore += 1.5;
      pl.mScore -= 1;
      M.ball.ownerSide=null;
      M.ball.tx = nearestDef.pl.x; M.ball.ty = nearestDef.pl.y;
      logEvent(M.minute,'🛡️',`${nearestDef.pl.name} מבצע תיקול ולוקח את הכדור מ-${pl.name}`);
      setPossession(oppSideKey(sideKey), nearestDef.idx, true);
      return;
    }
  }

  if(dribbleScore > passScore && dribbleScore>30){
    doDribble(sideKey, pl, attackingRight);
  } else {
    doPass(sideKey, side, pl, attackingRight);
  }
}
function oppSideKey(k){ return k==='home'?'away':'home'; }

function doDribble(sideKey, pl, attackingRight){
  const side = sideOf(sideKey);
  const dir = attackingRight?1:-1;
  const advance = rnd(4,9);
  pl.tx = clamp(pl.x + dir*advance, 2, PITCH_W-2);
  pl.ty = clamp(pl.y + rnd(-6,6), 2, PITCH_H-2);
  M.ball.tx = pl.tx; M.ball.ty = pl.ty;
  side.dribbles++;
  pl.mScore += 0.3;
  side.chain.push('Dribble');
  if(side.chain.length>4) side.chain.shift();
  if(Math.random()<0.12) logEvent(M.minute,'🏃',`${pl.name} עושה דריבל קדימה`);
}
function doPass(sideKey, side, pl, attackingRight){
  const dir = attackingRight?1:-1;
  // choose teammate further advanced ideally
  let candidates = side.players.filter(p=>p!==pl && !p.sentOff);
  candidates.sort((a,b)=> Math.abs((b.x-pl.x)*dir) - Math.abs((a.x-pl.x)*dir));
  const target = candidates[rnd(0,Math.min(2,candidates.length-1))] || candidates[0];
  if(!target) return;
  const passAcc = pl.pas + rnd(-20,15);
  side.passes++;
  if(passAcc < 38){
    // misplaced pass -> loose ball / turnover
    pl.mScore -= 1;
    side.assistCandidate = null; side.chain = [];
    M.ball.ownerSide=null;
    M.ball.tx = clamp((pl.x+target.x)/2 + rnd(-6,6), 2, PITCH_W-2);
    M.ball.ty = clamp((pl.y+target.y)/2 + rnd(-6,6), 2, PITCH_H-2);
    if(Math.random()<0.25) logEvent(M.minute,'➡️',`מסירה לא מדויקת של ${pl.name}`);
    return;
  }
  side.passesOk++;
  pl.mScore += 0.3;
  side.assistCandidate = pl.name;
  side.chain.push('Pass');
  if(side.chain.length>4) side.chain.shift();
  const idx = side.players.indexOf(target);
  setPossession(sideKey, idx, false);
  if(Math.random()<0.1) logEvent(M.minute,'➡️',`${pl.name} מוסר ל-${target.name}`);
}

function attemptShot(sideKey, opp, pl){
  const side = sideOf(sideKey);
  side.shots++;
  const gk = opp.players.find(p=>p.pos==='GK' && !p.sentOff);
  const shootVal = pl.sho*(pl.stamina/100) + rnd(-12,14);
  const saveVal = gk? gk.def*(gk.stamina/100) + rnd(-6,16) : rnd(20,40);
  logEvent(M.minute,'🎯',`${pl.name} בועט לשער!`);
  M.ball.tx = sideKey==='home'? PITCH_W-2 : 2; M.ball.ty = clamp(pl.y+rnd(-6,6),24,36);

  if(shootVal < 36 || Math.random()<0.20){
    logEvent(M.minute,'❌',`החמצה של ${pl.name}`);
    pl.mScore -= 0.8;
    M.ball.ownerSide=null; giveGoalKick(opp);
    return;
  }
  side.shotsOnTarget++;
  if(Math.random()<0.05){
    logEvent(M.minute,'🥅',`${pl.name} פוגע בקורה!`);
    pl.mScore -= 0.3;
    M.ball.ownerSide=null; giveCorner(opp);
    return;
  }
  if(shootVal > saveVal){
    scoreGoal(sideKey, pl);
  } else {
    if(gk){ logEvent(M.minute,'🧤',`הצלה מדהימה של ${gk.name}!`); gk.mScore += 2; opp.saves++; }
    pl.mScore -= 0.4;
    M.ball.ownerSide=null;
    if(Math.random()<0.4) giveCorner(opp); else giveGoalKick(opp);
  }
}
function giveGoalKick(opp){
  const gk = opp.players.find(p=>p.pos==='GK');
  if(gk) setPossession(opp===M.home?'home':'away', opp.players.indexOf(gk), true);
}
function giveCorner(opp){
  const attackSide = opp===M.home?'away':'home';
  const side = sideOf(attackSide);
  side.corners++;
  logEvent(M.minute,'🚩',`קרן ל${side.team.name}`);
  let takerIdx = side.players.findIndex(p=>p.pos==='ATT' && !p.sentOff);
  if(takerIdx<0) takerIdx = side.players.findIndex(p=>!p.sentOff && p.pos!=='GK');
  if(takerIdx<0) takerIdx = 0;
  M.ball.x = attackSide==='home'? PITCH_W-1:1; M.ball.y=2;
  setPossession(attackSide, takerIdx, true);
}

function scoreGoal(sideKey, scorer, isPenalty){
  const side = sideOf(sideKey);
  side.goals++;
  scorer.ref.form = Math.min(99, scorer.ref.form+2);
  scorer.mScore += 10;
  let assistName = null;
  if(!isPenalty && side.assistCandidate && side.assistCandidate!==scorer.name){
    assistName = side.assistCandidate;
    const assistPl = side.players.find(p=>p.name===assistName);
    if(assistPl) assistPl.mScore += 6;
  }
  const playChain = isPenalty ? ['Penalty'] : (side.chain.length? side.chain.slice(-3) : ['Solo run']);
  const play = [...playChain, 'Shot', 'Goal'].join(' → ');
  const logObj = {minute:M.minute, scorer:scorer.name, assist:assistName, play};
  (sideKey==='home'?M.homeGoalsLog:M.awayGoalsLog).push(logObj);
  updateScoreDisplay();
  showToast(`⚽ GOAL! ${scorer.name} — ${M.home.goals}-${M.away.goals}`);
  logEvent(M.minute,'⚽',`שער! ${scorer.name} כובש עבור ${side.team.name}${assistName?` (בישול: ${assistName})`:''}`);
  // reset to kickoff-ish
  M.ball.ownerSide=null;
  side.assistCandidate=null; side.chain=[];
  M.ball.x=50; M.ball.y=30; M.ball.tx=50; M.ball.ty=30;
  const other = sideKey==='home'?M.away:M.home;
  const idx = other.players.findIndex(p=>p.pos==='MID');
  setPossession(sideKey==='home'?'away':'home', idx>=0?idx:3, true);
}

function commitFoul(defTeam, defender, attTeam, attacker){
  const inBox = Math.abs((defTeam===M.home?PITCH_W:0) - attacker.x) < 18 && attacker.y>16 && attacker.y<44;
  defTeam.fouls++;
  defender.pl.mScore -= 0.6;
  logEvent(M.minute,'🛡️',`עבירה של ${defender.pl.name} על ${attacker.name}`);
  // card chance
  const cardRoll = Math.random();
  if(cardRoll<0.12){
    giveCard(defender.pl, defTeam, 'red');
  } else if(cardRoll<0.42){
    giveCard(defender.pl, defTeam, 'yellow');
  }
  if(inBox && Math.random()<0.5){
    startPenalty(attTeam===M.home?'home':'away', attacker, defTeam===M.home?'home':'away');
    return;
  }
  // free kick -> possession to attacking team near foul spot
  M.ball.ownerSide=null;
  M.ball.x = attacker.x; M.ball.y = attacker.y;
  const idx = attTeam.players.indexOf(attacker);
  setPossession(attTeam===M.home?'home':'away', idx, true);
}

function giveCard(player, side, type){
  if(type==='yellow'){
    player.cards = (player.cards||0)+1;
    side.cardsY++;
    player.mScore -= 2;
    logEvent(M.minute,'🟨',`כרטיס צהוב ל-${player.name}`);
    M.cardLog.push({name:player.name, teamId:side.team.id, type:'yellow'});
    if(player.cards>=2){
      logEvent(M.minute,'🟨🟨➡️🟥',`${player.name} מקבל כרטיס צהוב שני — כרטיס אדום!`);
      M.cardLog.push({name:player.name, teamId:side.team.id, type:'red'});
      side.cardsR++;
      sendOff(player, side);
    }
  } else {
    side.cardsR++;
    player.mScore -= 4;
    logEvent(M.minute,'🟥',`כרטיס אדום ל-${player.name}!`);
    M.cardLog.push({name:player.name, teamId:side.team.id, type:'red'});
    sendOff(player, side);
  }
}
function sendOff(player, side){
  player.sentOff = true;
  player.tx = -10; player.ty = -10; player.x=-10; player.y=-10;
  showToast(`🟥 RED CARD — ${player.name}`);
}

/* --------------------------------- Penalty -------------------------------- */
function startPenalty(attackSideKey, taker, defendSideKey){
  const gk = sideOf(defendSideKey).players.find(p=>p.pos==='GK');
  if(HEADLESS){
    resolvePenaltyHeadless(taker, gk, attackSideKey);
    return;
  }
  M.penaltyActive = true;
  M.paused = true;
  const overlay = document.createElement('div');
  overlay.className='penalty-overlay';
  overlay.id='penaltyOverlay';
  overlay.innerHTML = `
    <div class="penalty-title">PENALTY!</div>
    <div style="font-family:'Oswald'; font-size:16px; color:var(--text-dim);">${taker.name} מול ${gk?gk.name:'השוער'}</div>
    <div class="penalty-scene" id="penScene">
      <svg width="100%" height="100%" viewBox="0 0 500 180">
        <rect x="0" y="0" width="500" height="180" fill="#0e2a1c"/>
        <rect x="40" y="30" width="8" height="120" fill="#e9e9e9"/>
        <rect x="452" y="30" width="8" height="120" fill="#e9e9e9"/>
        <rect x="40" y="30" width="420" height="8" fill="#e9e9e9"/>
        <circle id="penBall" cx="250" cy="150" r="7" fill="#f4f4f4"/>
        <circle id="penGK" cx="250" cy="90" r="10" fill="#e8b94b"/>
      </svg>
    </div>
    <div id="penResult" style="font-family:'Oswald'; font-size:22px; min-height:30px;"></div>
  `;
  document.body.appendChild(overlay);
  setTimeout(()=>resolvePenalty(taker, gk, attackSideKey), 1400);
}
function penaltyOutcome(taker, gk){
  const dirs = ['left','center','right'];
  const shotDir = dirs[rnd(0,2)];
  const gkGuess = dirs[rnd(0,2)];
  const shotQuality = taker.sho + rnd(-15,20);
  const gkQuality = gk? gk.def + rnd(-15,20) : 30;
  const saved = (gkGuess===shotDir) && gkQuality>shotQuality-10;
  return {shotDir, gkGuess, shotQuality, saved};
}

/* ------------------------------ PENALTY SHOOTOUT (cup ties only) ------------------------------ */
function runPenaltyShootout(){
  const homeGK = M.home.players.find(p=>p.pos==='GK' && !p.sentOff) || M.home.players[0];
  const awayGK = M.away.players.find(p=>p.pos==='GK' && !p.sentOff) || M.away.players[0];
  const homeTakers = M.home.players.filter(p=>!p.sentOff && p!==homeGK).sort((a,b)=>b.sho-a.sho);
  const awayTakers = M.away.players.filter(p=>!p.sentOff && p!==awayGK).sort((a,b)=>b.sho-a.sho);
  if(!homeTakers.length) homeTakers.push(homeGK);
  if(!awayTakers.length) awayTakers.push(awayGK);
  let hs=0, as=0, round=0;
  const kicks = [];
  function takeKick(taker, gk){
    const {saved, shotQuality} = penaltyOutcome(taker, gk);
    return !saved && shotQuality>=22;
  }
  // First 5 rounds each (or until the outcome is already mathematically decided).
  while(round<5){
    const ht = homeTakers[round % homeTakers.length];
    const scoredH = takeKick(ht, awayGK);
    if(scoredH) hs++;
    kicks.push({side:'home', name:ht.name, scored:scoredH});
    const remainingH = 5-round-1, remainingA = 5-round;
    if(hs > as+remainingA){ round++; break; } // already unreachable for away
    const at = awayTakers[round % awayTakers.length];
    const scoredA = takeKick(at, homeGK);
    if(scoredA) as++;
    kicks.push({side:'away', name:at.name, scored:scoredA});
    round++;
    if(hs > as+(5-round) || as > hs+(5-round)) break;
  }
  // Sudden death if still level after 5 rounds each
  let sdRound=0;
  while(hs===as && sdRound<10){
    const ht = homeTakers[(round+sdRound) % homeTakers.length];
    const scoredH = takeKick(ht, awayGK);
    if(scoredH) hs++;
    kicks.push({side:'home', name:ht.name, scored:scoredH});
    const at = awayTakers[(round+sdRound) % awayTakers.length];
    const scoredA = takeKick(at, homeGK);
    if(scoredA) as++;
    kicks.push({side:'away', name:at.name, scored:scoredA});
    sdRound++;
  }
  M.shootout = {home:hs, away:as, kicks, winnerSide: hs>as?'home':'away'};
  logEvent(M.minute,'🥅', `PENALTY SHOOTOUT: ${M.home.team.name} ${hs} - ${as} ${M.away.team.name}`);
  if(!HEADLESS) showToast(`🥅 SHOOTOUT: ${M.home.team.name} ${hs}-${as} ${M.away.team.name}`);
  endMatch();
}
function resolvePenaltyHeadless(taker, gk, attackSideKey){
  const {shotQuality, saved} = penaltyOutcome(taker, gk);
  if(saved){
    logEvent(M.minute,'🧤',`${gk.name} עוצר את הפנדל של ${taker.name}!`);
    if(gk) gk.mScore += 5;
    taker.mScore -= 1.5;
    const side = sideOf(defendKey(attackSideKey)); side.saves++;
  } else if(shotQuality<25){
    logEvent(M.minute,'❌',`${taker.name} מבזבז את הפנדל`);
    taker.mScore -= 2;
  } else {
    const side = attackSideKey==='home'?M.home:M.away;
    scoreGoal(attackSideKey, side.players.find(p=>p.name===taker.name), true);
  }
  M.ball.ownerSide=null;
}
function defendKey(attackSideKey){ return attackSideKey==='home'?'away':'home'; }
function resolvePenalty(taker, gk, attackSideKey){
  const {shotDir, gkGuess, shotQuality, saved} = penaltyOutcome(taker, gk);
  const ballEl = document.getElementById('penBall');
  const gkEl = document.getElementById('penGK');
  const xMap = {left:100, center:250, right:400};
  ballEl.setAttribute('cx', xMap[shotDir]); ballEl.setAttribute('cy', 40);
  gkEl.setAttribute('cx', xMap[gkGuess]);
  const resultBox = document.getElementById('penResult');
  setTimeout(()=>{
    if(saved){
      resultBox.innerHTML = `<span style="color:var(--blue)">🧤 ההצלה!</span>`;
      logEvent(M.minute,'🧤',`${gk.name} עוצר את הפנדל של ${taker.name}!`);
      showToast(`🧤 PENALTY SAVED — ${gk.name}`);
      if(gk) gk.mScore += 5;
      taker.mScore -= 1.5;
      sideOf(defendKey(attackSideKey)).saves++;
    } else if(shotQuality<25){
      resultBox.innerHTML = `<span style="color:var(--text-dim)">❌ מעל השער</span>`;
      logEvent(M.minute,'❌',`${taker.name} מבזבז את הפנדל`);
      showToast(`❌ PENALTY MISSED — ${taker.name}`);
      taker.mScore -= 2;
    } else {
      resultBox.innerHTML = `<span style="color:var(--green)">⚽ שער!</span>`;
      const side = attackSideKey==='home'?M.home:M.away;
      scoreGoal(attackSideKey, side.players.find(p=>p.name===taker.name), true);
    }
    setTimeout(()=>{
      document.getElementById('penaltyOverlay').remove();
      M.penaltyActive=false; M.paused=false;
      M.ball.ownerSide=null;
    }, 1300);
  }, 900);
}

/* -------------------------------- Formation ------------------------------- */
function updateFormationTargets(){
  [M.home, M.away].forEach(side=>{
    const attackingRight = side===M.home;
    const ballX = M.ball.x;
    const pushFactor = clamp((attackingRight? ballX/PITCH_W : (PITCH_W-ballX)/PITCH_W), 0.15, 0.85);
    side.players.forEach((pl,i)=>{
      if(pl.sentOff) return;
      if(M.ball.ownerSide === (side===M.home?'home':'away') && M.ball.ownerIdx===i) return; // controlled elsewhere
      const slot = formationSlots(side.shape)[i];
      const baseX = attackingRight? slot.x : PITCH_W-slot.x;
      const shiftX = attackingRight? pushFactor*14-4 : -(pushFactor*14-4);
      let tx = clamp(baseX+shiftX, 3, PITCH_W-3);
      let ty = clamp(slot.y + (M.ball.y-30)*0.25, 3, PITCH_H-3);
      pl.tx = tx; pl.ty = ty;
    });
  });
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function doSub(fieldIdx, benchIdx){
  const side = mySideRef();
  const outPl = side.players[fieldIdx];
  const inRef = side.bench[benchIdx];
  const inPl = {ref:inRef.ref, name:inRef.name, pos:inRef.pos, ovr:inRef.ovr, pac:inRef.pac, dri:inRef.dri, pas:inRef.pas, sho:inRef.sho, def:inRef.def, phy:inRef.phy,
    stamina:100, x:outPl.x, y:outPl.y, tx:outPl.x, ty:outPl.y, baseX:outPl.baseX, baseY:outPl.baseY, hasBall:false, cards:0, sentOff:false, mScore:0, touches:0};
  side.bench.splice(benchIdx,1);
  side.players[fieldIdx] = inPl;
  side.subsUsed++;
  logEvent(M.minute, '🔄', `SUBSTITUTION: ${inPl.name} נכנס במקום ${outPl.name}`);
  showToast(`🔄 ${inPl.name} IN / ${outPl.name} OUT`);
  closeModal();
  renderSubsPanel();
}

/* ------------------------------- Camera / Canvas ---------------------------- */
function camZoom(dir){ cameraZoom = clamp(cameraZoom + dir*0.15, 0.8, 1.8); }
function camMode(mode){ cameraMode=mode;
  document.getElementById('btnFollowBall').classList.toggle('btn-blue', mode==='ball');
  document.getElementById('btnTactical').classList.toggle('btn-blue', mode==='tactical');
}
function toggleSpeed(){
  speedMultiplier = speedMultiplier===1?2:speedMultiplier===2?3:1;
  document.getElementById('btnSpeed').textContent = '⏱️ x'+speedMultiplier;
}

function drawPitch(){
  const canvas = document.getElementById('pitchCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  // camera transform
  let camX=50, camY=30, zoom=cameraZoom;
  if(cameraMode==='ball'){ camX=M.ball.x; camY=M.ball.y; }
  const scaleX = (W/PITCH_W)*zoom, scaleY=(H/PITCH_H)*zoom;
  function toPx(x,y){
    return [ (x-camX)*scaleX + W/2, (y-camY)*scaleY + H/2 ];
  }
  // background stripes
  for(let i=0;i<10;i++){
    ctx.fillStyle = i%2===0? '#0e2a1c':'#123321';
    const x0=(i/10)*PITCH_W;
    const [px0,py0]=toPx(x0,0); const [px1]=toPx(x0+PITCH_W/10,0);
    ctx.fillRect(px0,0,px1-px0,H);
  }
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2;
  function line(x1,y1,x2,y2){ const [a,b]=toPx(x1,y1); const [c,d]=toPx(x2,y2); ctx.beginPath(); ctx.moveTo(a,b); ctx.lineTo(c,d); ctx.stroke(); }
  line(0,0,PITCH_W,0); line(0,PITCH_H,PITCH_W,PITCH_H); line(0,0,0,PITCH_H); line(PITCH_W,0,PITCH_W,PITCH_H);
  line(PITCH_W/2,0,PITCH_W/2,PITCH_H);
  ctx.beginPath(); const [ccx,ccy]=toPx(PITCH_W/2,PITCH_H/2); ctx.arc(ccx,ccy, 8*scaleX/1,0,Math.PI*2); ctx.stroke();
  // penalty boxes
  line(0,15,14,15); line(14,15,14,45); line(0,45,14,45);
  line(PITCH_W,15,PITCH_W-14,15); line(PITCH_W-14,15,PITCH_W-14,45); line(PITCH_W,45,PITCH_W-14,45);
  // goals
  ctx.strokeStyle='#e9e9e9'; ctx.lineWidth=3;
  line(0,25,0,35); line(PITCH_W,25,PITCH_W,35);

  // players
  function drawTeamPlayers(side, color){
    side.players.forEach(pl=>{
      if(pl.sentOff) return;
      const [x,y] = toPx(pl.x,pl.y);
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.arc(x,y,9*zoom,0,Math.PI*2);
      ctx.fill();
      ctx.lineWidth=1.5; ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.stroke();
      ctx.fillStyle='#04140c'; ctx.font=`${10*zoom}px Oswald`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(pl.pos[0], x, y+1);
      ctx.fillStyle='rgba(234,245,239,.85)'; ctx.font=`${9*zoom}px Rajdhani`;
      ctx.fillText(pl.name.split(' ').slice(-1)[0], x, y+16*zoom);
    });
  }
  drawTeamPlayers(M.home, '#22c17a');
  drawTeamPlayers(M.away, '#2ea9ff');
  // ball
  const [bx,by]=toPx(M.ball.x,M.ball.y);
  ctx.beginPath(); ctx.fillStyle='#fff'; ctx.arc(bx,by,5*zoom,0,Math.PI*2); ctx.fill();
  ctx.lineWidth=1; ctx.strokeStyle='#333'; ctx.stroke();
}

/* --------------------------------- End Match ------------------------------- */
let quickSimCommit = null; // baseline snapshot used to let "Play Again" re-roll a quick-sim result without double counting

function endMatch(){
  M.finished=true;
  cancelAnimationFrame(animHandle);

  if(M.isCup){
    finalizeCupMatch();
  } else {
    if(M.quickSim){
      if(quickSimCommit && quickSimCommit.roundIndex===M.roundIndex && quickSimCommit.leagueId===teamById(M.home.team.id).league){
        // a previous quick-sim roll for this same fixture was already committed — revert it first
        const lg = quickSimCommit.leagueId;
        if(lg==='A') career.tableA = quickSimCommit.tableSnapshot; else career.tableB = quickSimCommit.tableSnapshot;
        career.budget = quickSimCommit.budgetBefore;
        career.reputation = quickSimCommit.repBefore;
        career.currentRound = quickSimCommit.currentRoundBefore;
      } else {
        const lg = teamById(M.home.team.id).league;
        quickSimCommit = {
          roundIndex: M.roundIndex,
          leagueId: lg,
          tableSnapshot: JSON.parse(JSON.stringify(tableFor(lg))),
          budgetBefore: career.budget,
          repBefore: career.reputation,
          currentRoundBefore: career.currentRound,
        };
      }
    } else {
      quickSimCommit = null;
    }

    recordResult(M.home.team.id, M.away.team.id, M.home.goals, M.away.goals, M.roundIndex);
    // finances: matchday income
    const my = myTeam();
    const myScored = (M.home.team.id===my.id)? M.home.goals : M.away.goals;
    career.budget += 2 + myScored*0.5;
    career.reputation = clamp(career.reputation + ((M.home.team.id===my.id? M.home.goals-M.away.goals : M.away.goals-M.home.goals)>0?1:-0.3), 40, 99);
    career.currentRound = M.roundIndex+1;
    advanceCalendar();
    maybeDrawCup();
    maybeAutoAdvanceCup();
  }

  // Player of the Match — based on accumulated in-match performance score (goals, assists,
  // successful passes/dribbles, tackles, saves, minus turnovers/misses/cards), not a random pick.
  const allPlayers = [...M.home.players, ...M.away.players];
  const best = allPlayers.slice().sort((a,b)=>b.mScore-a.mScore)[0];
  const rating = best ? Math.max(4, Math.min(10, Math.round((6 + best.mScore*0.13)*10)/10)) : null;
  M.motm = best ? {name:best.name, rating} : null;

  recordSeasonStats();

  saveCareer();
  if(!HEADLESS){
    document.getElementById('mhClock').textContent = "90'";
    document.getElementById('mhStatus').textContent = "FULL TIME";
    setTimeout(showResultScreen, 900);
  } else {
    showResultScreen();
  }
}

function goalDetailHtml(g){
  const scorerPos = ([...M.home.players, ...M.away.players].find(p=>p.name===g.scorer)||{}).pos;
  return `<div style="margin:8px 0; padding:8px 0; border-bottom:1px dashed var(--line); display:flex; gap:10px; align-items:flex-start;">
    ${avatarSvg(scorerPos,32)}
    <div>
      <div><b style="color:var(--text)">${String(g.minute).padStart(2,'0')}' ⚽ ${g.scorer}</b></div>
      <div style="font-size:12px; color:var(--text-dim);">🅰️ Assist: ${g.assist || 'None'}</div>
      <div style="font-size:11px; color:var(--text-dim-2);">Play: ${g.play}</div>
    </div>
  </div>`;
}

function showResultScreen(){
  const c = document.getElementById('summaryCard');
  const allGoals = [...M.homeGoalsLog, ...M.awayGoalsLog].sort((a,b)=>a.minute-b.minute);
  const totalPass = M.home.passes+M.away.passes || 1;
  const totalPassOk = M.home.passesOk+M.away.passesOk || 1;
  const totalShots = M.home.shots+M.away.shots || 1;
  const totalOnTarget = (M.home.shotsOnTarget+M.away.shotsOnTarget) || 1;
  const totalDribbles = M.home.dribbles+M.away.dribbles || 1;
  const totalTackles = M.home.tackles+M.away.tackles || 1;
  const totalCorners = M.home.corners+M.away.corners || 1;
  const totalFouls = M.home.fouls+M.away.fouls || 1;
  const totalY = M.home.cardsY+M.away.cardsY || 1;
  const totalR = M.home.cardsR+M.away.cardsR || 1;
  const totalSaves = M.home.saves+M.away.saves || 1;
  function barRow(label, a, b, tot){
    const pa = Math.round(a/tot*100);
    return `<div class="stat-bar-row"><div class="lbl"><span>${a}</span><span>${label}</span><span>${b}</span></div>
      <div class="stat-bar-track"><div class="stat-bar-a" style="width:${pa}%"></div><div class="stat-bar-b" style="width:${100-pa}%"></div></div></div>`;
  }
  const isQuick = !!M.quickSim;
  const buttonsHtml = (isQuick && !M.isCup) ? `
      <button class="btn btn-blue" onclick="playAgainQuickSim()">🔄 PLAY AGAIN</button>
      <button class="btn btn-primary" onclick="backToDashboardFromSummary()">🏠 BACK TO CAREER</button>
      <button class="btn btn-ghost" onclick="toggleMatchDetails()">📋 MATCH DETAILS</button>
    ` : isQuick ? `
      <button class="btn btn-primary" onclick="backToDashboardFromSummary()">🏠 BACK TO CAREER</button>
      <button class="btn btn-ghost" onclick="toggleMatchDetails()">📋 MATCH DETAILS</button>
    ` : `
      <button class="btn btn-primary" onclick="backToDashboardFromSummary()">חזרה למרכז הניהול</button>
    `;
  c.innerHTML = `
    <h2 style="text-align:center;">${M.isCup? '👑 KING\'S CUP RESULT' : (isQuick? 'MATCH RESULT' : 'MATCH SUMMARY')}</h2>
    <div class="summary-score" style="margin-top:16px;">${M.home.team.name} ${M.home.goals} - ${M.away.goals} ${M.away.team.name}</div>
    <div class="summary-sub">${M.isCup? `👑 גביע המלך` : `סיבוב ${M.roundIndex+1} · עונה ${career.season}`}${isQuick?' · ⚡ Quick Sim':''}${M.extraTimePlayed?' · ⏱️ Extra Time (120\')':''}</div>
    ${M.shootout ? `<div style="text-align:center; margin:8px 0; color:var(--gold); font-family:'Oswald'; font-size:18px;">🥅 PENALTIES: ${M.home.team.name} ${M.shootout.home} - ${M.shootout.away} ${M.away.team.name}</div>` : ''}
    ${M.isCup ? `<div style="text-align:center; margin:8px 0; color:var(--green); font-size:14px;">✅ ${(M.shootout? (M.shootout.winnerSide==='home'?M.home:M.away) : (M.home.goals>M.away.goals?M.home:M.away)).team.name} עולה לשלב הבא!</div>` : ''}
    <div class="goal-list"><b style="color:var(--text)">⚽ Goals:</b>${allGoals.length? allGoals.map(goalDetailHtml).join('') : '<div style="color:var(--text-dim);">אין שערים</div>'}</div>
    ${barRow('Possession', Math.round(M.home.possessionTicks/(M.home.possessionTicks+M.away.possessionTicks+1)*100)+'%', Math.round(M.away.possessionTicks/(M.home.possessionTicks+M.away.possessionTicks+1)*100)+'%', 100)}
    ${barRow('Shots', M.home.shots, M.away.shots, totalShots)}
    ${barRow('Shots on Target', M.home.shotsOnTarget, M.away.shotsOnTarget, totalOnTarget)}
    ${barRow('Passes', M.home.passes, M.away.passes, totalPass)}
    ${barRow('Successful Passes', M.home.passesOk, M.away.passesOk, totalPassOk)}
    ${barRow('Dribbles', M.home.dribbles, M.away.dribbles, totalDribbles)}
    ${barRow('Tackles', M.home.tackles, M.away.tackles, totalTackles)}
    ${barRow('Corners', M.home.corners, M.away.corners, totalCorners)}
    ${barRow('Fouls', M.home.fouls, M.away.fouls, totalFouls)}
    ${barRow('Yellow Cards', M.home.cardsY, M.away.cardsY, totalY)}
    ${barRow('Red Cards', M.home.cardsR, M.away.cardsR, totalR)}
    ${barRow('Saves', M.home.saves, M.away.saves, totalSaves)}
    <div class="motm">⭐ PLAYER OF THE MATCH<br>${M.motm? `${M.motm.name} — ${M.motm.rating.toFixed(1)}` : '-'}</div>
    <div id="matchDetailsPanel" class="hidden" style="margin-top:18px; max-height:260px; overflow-y:auto; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px;"></div>
    <div style="text-align:center; margin-top:24px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      ${buttonsHtml}
    </div>
  `;
  showScreen('summary');
}
function toggleMatchDetails(){
  const panel = document.getElementById('matchDetailsPanel');
  panel.classList.toggle('hidden');
  if(!panel.classList.contains('hidden')){
    panel.innerHTML = M.events.map(e=>`<div class="ev-line"><span class="ev-time">${String(e.minute).padStart(2,'0')}'</span><span class="ev-icon">${e.icon}</span><span>${e.text}</span></div>`).join('');
  }
}
function backToDashboardFromSummary(){
  showScreen('dashboard');
  renderDashboard();
  maybeGenerateIncomingOffer();
}
</script>
